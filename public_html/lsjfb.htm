<script>

当前联赛=Object.keys(联赛列表)[0]
document.title=当前联赛
自动刷新任务编号=undefined
选中球队=''
过去比赛列表=undefined
将来比赛列表=undefined
function 查询地址(日期标准格式,需要日期列表=false){return`https://api.msn.com/sports/liveschedules?apikey=kO1dI4ptCTTylLkPL1ZTHYP8JhLKb8mRDoA5yotmNJ&version=1.0&cm=zh-cn&tzoffset=8&date=${日期标准格式}&ids=${联赛列表[当前联赛].查询参数名称}&${需要日期列表?'withcalendar=true':''}&type=LeagueSchedule`
}
function 日期数字转文字(日期数){
  return new Date(+日期数.date).toLocaleDateString(undefined,{month:'long',day:'numeric',weekday:'long',timeZone:'Etc/GMT-8'})
}
function 日期转标准格式(日期){
  return 日期.toLocaleDateString('zh',{year:'numeric',month:'2-digit',day:'2-digit',timeZone:'Etc/GMT-8'}).replaceAll('/','-')
}
function 世界时日期标准格式(日期){
  return 日期.toISOString().substr(0,10)
}
页面已填充=false
积分={}
主场积分={}
客场积分={}
临时积分={}
选中的积分对象=积分
积分表开始日期=undefined
积分表截止日期=undefined
已找到的比赛={}//额外找到的比赛
async function 更新(){
    const 更新的时间=现在的时间=new Date
    对象=await(await fetch(查询地址(日期转标准格式(现在的时间),true))).json()
    if(对象.value.length!=1){console.log(`接口查询接收到${对象.value.length}个结果`);return}
    项目=对象.value[0]
    内部项目=项目.schedules
    if(内部项目.length!=1){console.log(`查询结果有${内部项目.length}个项目`);return}
    比赛日=内部项目[0].days;
    默认的日期=内部项目[0].selectedDay.date
    默认日期的赛事=内部项目[0].games;
    if(!页面已填充){
      document.getElementsByTagName('body')[0].innerHTML=页面模板;
      导航栏=document.getElementsByClassName('导航')[0]
      for(let 联赛 in 联赛列表){
        导航栏.insertAdjacentHTML('beforeend','&nbsp;')
        联赛按钮=document.createElement('a')
        联赛按钮.setAttribute('href','javascript:void(0)')
        联赛按钮.classList.add(`联赛-${联赛}`)
        联赛按钮.innerHTML=联赛
        联赛按钮.onclick=function(){
         if(当前联赛!=联赛){
          当前联赛=联赛
          document.title=当前联赛
          clearInterval(自动刷新任务编号)
          积分={}
          主场积分={}
          客场积分={}
          临时积分={}
          选中的积分对象=积分
          积分表开始日期=积分表截止日期=undefined
          更新()
          自动刷新任务编号=setInterval(更新,60000)
         }
        }
        导航栏.appendChild(联赛按钮)
      }
      const 积分显示区=document.getElementById('积分')
      const 积分选择=document.createElement('div')
      积分选择.innerHTML='<a href=javascript:void(0) onclick=清除已选的日期(this);if(选中的积分对象!=主场积分){选中的积分对象=主场积分}else{选中的积分对象=积分};制作积分表()>主</a> <a href=javascript:void(0) onclick=清除已选的日期(this);if(选中的积分对象!=客场积分){选中的积分对象=客场积分}else{选中的积分对象=积分};制作积分表()>客</a> <a href=javascript:void(0) onclick=生成时段选择元素(this)>阶段</a>'
      积分显示区.parentNode.insertBefore(积分选择,积分显示区)
      页面已填充=true
    }
    (进行时=document.getElementById('即时关注')).innerHTML=''
    比赛列表=''
    for(let 比赛 of 默认日期的赛事){
        const 比赛结果=比赛数据显示(比赛)
        比赛列表+=比赛结果[0]
    }
    进行时.innerHTML=比赛列表;
    过去的赛事结果=document.getElementById('赛事结果')
    将来赛程=document.getElementById('赛程')
    按比赛日划分的赛事=new Array(比赛日.length)
    过去的比赛日总数=0
    将来的比赛日总数=0
    for(let 条目 in 积分){delete 积分[条目]}
    for(let 条目 in 主场积分){delete 主场积分[条目]}
    for(let 条目 in 客场积分){delete 客场积分[条目]}
    for(let 条目 in 临时积分){delete 临时积分[条目]}
    走势={}
    过去比赛列表=''
    一支球队的过去比赛列表=''
    将来比赛列表=''
    一支球队的将来比赛列表=''
    比赛列表=''
    选中球队的比赛=''
    积分榜分组=[]
    const 今天的日期=世界时日期标准格式(现在的时间)
    今天比赛日序号=-1;今日有比赛=0
    for(let 序号=0;序号<比赛日.length;序号++){
      const 比赛日日期=new Date(+比赛日[序号].date)
      const 固定序号=序号
      const 比赛日在选定日期范围之内=积分表开始日期&&积分表截止日期&&比赛日日期>积分表开始日期&&比赛日日期<积分表截止日期
      if(今天的日期===世界时日期标准格式(比赛日日期)){今天比赛日序号=固定序号}
      fetch(查询地址(日期转标准格式(比赛日日期))).then(async 查询的回复=>{if(现在的时间.getTime()!==更新的时间.getTime()){return}
        查询的结果对象=await 查询的回复.json()
        if(查询的结果对象.value.length!==1){console.log(`接口查询接收到${查询的结果对象.value.length}个结果`);return}
        查询的结果项目=查询的结果对象.value[0]
        查询的结果内部项目=查询的结果项目.schedules
        if(查询的结果内部项目.length!==1){console.log(`查询结果有${查询的结果内部项目.length}个项目`);return}
        所查日期的赛事=查询的结果内部项目[0].games
        按比赛日划分的赛事[固定序号]=所查日期的赛事
        if(今天的日期===世界时日期标准格式(比赛日日期)){
          今日有比赛=1
          for(let 比赛 of 所查日期的赛事){
            const 比赛结果=比赛数据显示(比赛)
            if(比赛.gameType.detailSeasonPhase=='RegularSeason'||比赛.gameType.detailSeasonPhase=='Group'){
              const 主队的分组=积分榜分组.find(分组=>分组.includes(比赛结果[1].队名))
              const 客队的分组=积分榜分组.find(分组=>分组.includes(比赛结果[2].队名))
              if(主队的分组&&!客队的分组){if(!主队的分组.includes(比赛结果[2].队名)){主队的分组.push(比赛结果[2].队名)}}
              else if(!主队的分组&&客队的分组){if(!客队的分组.includes(比赛结果[1].队名)){客队的分组.push(比赛结果[1].队名)}}
              else if(主队的分组&&客队的分组){if(主队的分组!==客队的分组){主队的分组.push(...客队的分组);积分榜分组.splice(积分榜分组.indexOf(客队的分组),1)}}
              else{积分榜分组.push(比赛结果.slice(1,3).map(队=>队.队名))}
            }
            比赛列表+=比赛结果[0]
            if(比赛结果[1].队名===选中球队||比赛结果[2].队名===选中球队){选中球队的比赛+=比赛结果[0]}
            存储积分结果(比赛结果,比赛日[固定序号].date)
            if(比赛日在选定日期范围之内){存储部分阶段的积分结果(比赛结果,比赛日[固定序号].date)}
          }
          进行时.innerHTML=比赛列表;
        }else if(new Date(今天的日期)>比赛日日期){
          过去的比赛日总数++
        }else if(new Date(今天的日期)<比赛日日期){
          将来的比赛日总数++
        }
        if(过去的比赛日总数+将来的比赛日总数+今日有比赛===比赛日.length){
          显示完整的比赛列表()
        }
      })
    }

    显示完整的比赛列表=()=>{
      for(let 过去日期的序号=过去的比赛日总数-1;过去日期的序号>=0;过去日期的序号--){
        const 比赛日日期=new Date(+比赛日[过去日期的序号].date)
        const 日期在选定范围之内=积分表开始日期&&积分表截止日期&&比赛日日期>积分表开始日期&&比赛日日期<积分表截止日期
        for(let 比赛 of 按比赛日划分的赛事[过去日期的序号]){
          const 比赛结果=比赛数据显示(比赛)
          if(比赛.gameType.detailSeasonPhase=='RegularSeason'||比赛.gameType.detailSeasonPhase=='Group'){
              const 主队的分组=积分榜分组.find(分组=>分组.includes(比赛结果[1].队名))
              const 客队的分组=积分榜分组.find(分组=>分组.includes(比赛结果[2].队名))
              if(主队的分组&&!客队的分组){if(!主队的分组.includes(比赛结果[2].队名)){主队的分组.push(比赛结果[2].队名)}}
              else if(!主队的分组&&客队的分组){if(!客队的分组.includes(比赛结果[1].队名)){客队的分组.push(比赛结果[1].队名)}}
              else if(主队的分组&&客队的分组){if(主队的分组!==客队的分组){主队的分组.push(...客队的分组);积分榜分组.splice(积分榜分组.indexOf(客队的分组),1)}}
              else{积分榜分组.push(比赛结果.slice(1,3).map(队=>队.队名))}
          }
          过去比赛列表+=比赛结果[0]
          if(比赛结果[1].队名===选中球队||比赛结果[2].队名===选中球队){一支球队的过去比赛列表+=比赛结果[0]}
          存储积分结果(比赛结果,比赛日[过去日期的序号].date)
          if(日期在选定范围之内){存储部分阶段的积分结果(比赛结果,比赛日[过去日期的序号].date)}
        }
      }
      for(let 将来日期的序号=过去的比赛日总数+(今天比赛日序号===-1?0:1);将来日期的序号<过去的比赛日总数+将来的比赛日总数+(今天比赛日序号===-1?0:1);将来日期的序号++){
        const 比赛日日期=new Date(+比赛日[将来日期的序号].date)
        const 日期在选定范围之内=积分表开始日期&&积分表截止日期&&比赛日日期>积分表开始日期&&比赛日日期<积分表截止日期
        for(let 比赛 of 按比赛日划分的赛事[将来日期的序号]){
          const 比赛结果=比赛数据显示(比赛)
          if(比赛.gameType.detailSeasonPhase=='RegularSeason'||比赛.gameType.detailSeasonPhase=='Group'){
              const 主队的分组=积分榜分组.find(分组=>分组.includes(比赛结果[1].队名))
              const 客队的分组=积分榜分组.find(分组=>分组.includes(比赛结果[2].队名))
              if(主队的分组&&!客队的分组){if(!主队的分组.includes(比赛结果[2].队名)){主队的分组.push(比赛结果[2].队名)}}
              else if(!主队的分组&&客队的分组){if(!客队的分组.includes(比赛结果[1].队名)){客队的分组.push(比赛结果[1].队名)}}
              else if(主队的分组&&客队的分组){if(主队的分组!==客队的分组){主队的分组.push(...客队的分组);积分榜分组.splice(积分榜分组.indexOf(客队的分组),1)}}
              else{积分榜分组.push(比赛结果.slice(1,3).map(队=>队.队名))}
          }
          将来比赛列表+=比赛结果[0]
          if(比赛结果[1].队名===选中球队||比赛结果[2].队名===选中球队){一支球队的将来比赛列表+=比赛结果[0]}
          存储积分结果(比赛结果,比赛日[将来日期的序号].date)
          if(日期在选定范围之内){存储部分阶段的积分结果(比赛结果,比赛日[将来日期的序号].date)}
        }
      }
      if(当前联赛==='亚冠'&&过去的比赛日总数>=过去的比赛日总数+将来的比赛日总数&&将来比赛列表===''&&一支球队的将来比赛列表===''){
        (async()=>{
          let 最后一个日期=现在的时间;
          已找到的比赛={}
          let 新找到的比赛数量=10000
          for(;新找到的比赛数量>0;){
          const 额外的赛程=await(await fetch(`https://api.msn.com/sports/livearoundtheleague?apikey=kO1dI4ptCTTylLkPL1ZTHYP8JhLKb8mRDoA5yotmNJ&version=1.0&cm=zh-cn&tzoffset=8&datetime=${世界时日期标准格式(最后一个日期)}&id=Soccer_InternationalClubsAFCChampionsLeague`, {
              "credentials": "include"
            })).json()
              新找到的比赛数量=0
              for(let 比赛 of 额外的赛程.value[0].schedules[0].games){
               const 比赛结果=比赛数据显示(比赛)
               比赛对阵=比赛.startDateTime+比赛结果[1].队名+比赛结果[2].队名
               if(!已找到的比赛[比赛对阵]){
                将来比赛列表+=比赛结果[0]
                if(比赛结果[1].队名===选中球队||比赛结果[2].队名===选中球队){一支球队的将来比赛列表+=比赛结果[0]}
                已找到的比赛[比赛对阵]=比赛
                新找到的比赛数量++
               }
              }
              最后一个日期=new Date(+额外的赛程.value[0].schedules[0].games.pop().startDateTime)
          }
              将来赛程.innerHTML=选中球队?一支球队的将来比赛列表:将来比赛列表;
            })()
      }
      过去的赛事结果.innerHTML=选中球队?选中球队的比赛+一支球队的过去比赛列表:过去比赛列表
      将来赛程.innerHTML=选中球队?一支球队的将来比赛列表:将来比赛列表;
      const 下拉框=document.getElementById('积分').previousElementSibling.getElementsByTagName('select')
      if(下拉框.length==2){填充时段下拉框内容(下拉框)}
      制作折线图()
      制作积分表()
    }
}

更新()

function 填充时段下拉框内容(两个下拉框){
  let [第一个下拉框,第二个下拉框]=两个下拉框
  if(积分表开始日期){开始日期已选序号=第一个下拉框.selectedIndex}
  if(积分表截止日期){截止日期已选序号=第二个下拉框.selectedIndex}
  第一个下拉框.innerHTML=第二个下拉框.innerHTML=''
  第一个下拉框.innerHTML+='<option selected value=1>赛季开始</option>'
  let 上一个比赛日=undefined
  for(let 单个比赛日 of 比赛日){
    const 日期=new Date(世界时日期标准格式(new Date(+单个比赛日.date)))
    if(上一个比赛日){
      if((日期差=(日期-上一个比赛日)/86400000.0)>1){
        中间日期数值=(日期-(-上一个比赛日))/2.0
        日期文字=new Date(中间日期数值).toLocaleDateString(undefined,{month:'short',day:'numeric',weekday:'long'})
        第一个下拉框.innerHTML+='<option value='+中间日期数值+'>'+日期文字+'</option>'
        第二个下拉框.innerHTML+='<option value='+中间日期数值+'>'+日期文字+'</option>'
      }
    }
    上一个比赛日=日期
  }
  第二个下拉框.innerHTML+=`<option selected value=${上一个比赛日.getTime()+86400000*7}>赛季结束</option>`
  if(积分表开始日期){第一个下拉框.selectedIndex=开始日期已选序号}
  if(积分表截止日期){第二个下拉框.selectedIndex=截止日期已选序号}
  return [第一个下拉框,第二个下拉框]
}

function 生成时段选择元素(元素){
  const 元素的上级元素=元素.parentNode
  元素.outerHTML='从<select></select>到<select></select>'
  let [第一个下拉框,第二个下拉框]=填充时段下拉框内容(元素的上级元素.getElementsByTagName('select'))
  第一个下拉框.onchange=第二个下拉框.onchange=function(){
    积分表开始日期=+第一个下拉框.value
    积分表截止日期=+第二个下拉框.value
    for(let 条目 in 临时积分){delete 临时积分[条目]}
    for(let 所有比赛日的次序=0;所有比赛日的次序<比赛日.length;所有比赛日的次序++){
      日期数字=+比赛日[所有比赛日的次序].date
      if(日期数字<积分表开始日期||日期数字>积分表截止日期){continue}
      一个日期的赛事=按比赛日划分的赛事[所有比赛日的次序]
      for(let 比赛 of 一个日期的赛事){
        比赛结果=比赛数据显示(比赛)
        存储部分阶段的积分结果(比赛结果,日期数字)
      }
    }
    选中的积分对象=临时积分
    制作积分表()
  }
}

function 清除已选的日期(元素){
  let [第一个下拉框,第二个下拉框]=元素.parentNode.getElementsByTagName('select')
  if(第一个下拉框){第一个下拉框.selectedIndex=0}

function 制作折线图(){
  积分数组=[]
  for(let 球队 in 积分){积分[球队].队=球队;积分[球队].组=积分榜分组.indexOf(积分榜分组.find(分组=>分组.includes(球队)));积分数组.push(积分[球队])}
  if(积分数组.length===0){document.getElementsByClassName('内容')[0].children[0].style.minHeight='calc(100vh - 16px - 27px)';return}
  积分数组.sort((前面的球队数据,后面的球队数据)=>{
    同组=前面的球队数据.组-后面的球队数据.组
    if(同组!=0){return 同组}
    积分差=3*后面的球队数据.胜+后面的球队数据.平-3*前面的球队数据.胜-前面的球队数据.平
    if(积分差!=0){return 积分差}
    净胜球差=后面的球队数据.进-后面的球队数据.失-前面的球队数据.进+前面的球队数据.失
    if(净胜球差!=0){return 净胜球差}
    进球数差=后面的球队数据.进-前面的球队数据.进
    return 进球数差
  })
  走势图表=document.getElementById('图表')
  折线=''
  初始日期=+比赛日[0].date-7*86400000
  图表高度=2+3*积分数组[0].胜+积分数组[0].平
  走势图表.previousElementSibling.style.minHeight=`calc(100vh - 16px - 27px - ${图表高度}px)`
  比赛日进度时间={}
  比赛日进度时间[比赛日[0].date]=7*86400000
  for(let 比赛日序号=1;比赛日序号<比赛日.length;比赛日序号++){
    比赛日进度时间[比赛日[比赛日序号].date]=比赛日进度时间[比赛日[比赛日序号-1].date]+Math.min(+比赛日[比赛日序号].date-(+比赛日[比赛日序号-1].date),7*86400000)
  }

  图表宽度=2+(比赛日进度时间[默认的日期])/86400000
  for(let 球队 in 走势){
    走势[球队].sort((前一个比赛日期,后一个比赛日期)=>{return +前一个比赛日期.日期-(+后一个比赛日期.日期)})
    上一个比赛日得分={日期:初始日期}
    上一个比赛日总分=0
    球队颜色=颜色[球队]??文字随机颜色(球队)
    走势[球队].forEach(比赛日得分=>{
      起点横坐标=1+(比赛日进度时间[上一个比赛日得分.日期]??0)/86400000.0
      起点纵坐标=图表高度-1-上一个比赛日总分
      终点横坐标=1+(比赛日进度时间[比赛日得分.日期])/86400000.0
      终点纵坐标=图表高度-1-(上一个比赛日总分+比赛日得分.分数)
      折线+=`<line x1=${10*起点横坐标} y1=${10*起点纵坐标} x2=${10*终点横坐标} y2=${10*终点纵坐标} style=stroke:${球队颜色}${选中球队!=''&&球队!=选中球队?';display:none':''} class=${球队.replaceAll(' ','')} />`
      上一个比赛日总分+=比赛日得分.分数
      上一个比赛日得分=比赛日得分
    })
  }
  走势图表.innerHTML=`<svg height=${10*图表高度} width=${10*图表宽度} style=background:white>${折线}</svg>`
  if(!图表滚动到最右边){走势图表.scroll({left:走势图表.offsetWidth});图表滚动到最右边=true}
}

function 文字随机颜色(名字){
  第一个字符=名字.charCodeAt(0).toString(16)
  if(第一个字符.length==1||第一个字符.length==3){
    第一个字符='0'+第一个字符
  }
  if(名字.length>1){
    最后一个字符=名字.charCodeAt(名字.length-1).toString(16)
    if(最后一个字符.length==1||最后一个字符.length==3){
      最后一个字符='0'+最后一个字符
    }
  }else{最后一个字符='00'}
  if(名字.length>2){
    第二个字符=名字.charCodeAt(1).toString(16)
    if(第二个字符.length==1||第二个字符.length==3){
      第二个字符='0'+第二个字符
    }
  }else{第二个字符='00'}
  return`#${第一个字符.substr(第一个字符.length-2,2)}${最后一个字符.substr(最后一个字符.length-2,2)}${第二个字符.substr(第二个字符.length-2,2)}`
}

function 队徽基础地址(代码){return`https://www.bing.com/th?id=${代码}`}

function 比赛数据显示(比赛){
  时间=new Date(+比赛.startDateTime).toLocaleString(undefined,{dateStyle:'short',timeStyle:'short'})
  状态=比赛.gameState.detailedGameStatus
  进行时间=比赛.currentPlayingPeriod?
    比赛.currentPlayingPeriod.playingPeriodType=='Half'?
      比赛.currentPlayingPeriod.number==1?'上半场':比赛.currentPlayingPeriod.number==2?'下半场':''
      :比赛.currentPlayingPeriod.playingPeriodType=='End'?'':`${比赛.currentPlayingPeriod.playingPeriodType??''}${比赛.currentPlayingPeriod.number??''}`
    :''
  进行时间+=`${比赛.gameState.gameClock.minutes?`${比赛.gameState.gameClock.minutes}＇${比赛.gameState.gameClock.seconds}＂`:''}${比赛.gameState.gameClock.stoppageMinutes?`＋${比赛.gameState.gameClock.stoppageMinutes}＇${比赛.gameState.gameClock.stoppageSeconds}＂`:''}`
  const 比赛种类翻译={Group:'小组赛',RoundOf16:'１６强赛',QuarterFinal:'四分之一决赛',SemiFinal:'半决赛',Final:'决赛'}
  种类=比赛.gameType.detailSeasonPhase=='RegularSeason'||比赛.gameType.detailSeasonPhase=='Group'?'':比赛种类翻译[比赛.gameType.detailSeasonPhase]??比赛.gameType.detailSeasonPhase??(比赛.gameType.simpleSeasonPhase==='PreSeason'?'预赛':比赛.gameType.simpleSeasonPhase)
  种类+=比赛.gameType.subPhaseNumber&&比赛.gameType.totalSubPhases>1?比赛.gameType.subPhaseNumber=='1'?'第一回合':比赛.gameType.subPhaseNumber=='2'?'第二回合':`第${比赛.gameType.subPhaseNumber}/${比赛.gameType.totalSubPhases}回合`:''
  开球时间待定=比赛.startTimeToBeAnnounced?'开球时间待定':''
  场馆=[比赛.venue?.location.longitude,比赛.venue?.location.latitude]
  场馆容量=比赛.venue?.capacity
  主队所有名称=比赛.participants[0].team.name
  主队=主队所有名称.localizedName??主队所有名称.rawName
  主队得分=比赛.participants[0].result?.score??''
  主队队徽=比赛.participants[0].team.image?队徽基础地址(比赛.participants[0].team.image.id):undefined
  主队胜率=比赛.participants[0].probabilities?.winProbability
  客队所有名称=比赛.participants[1].team.name
  客队=客队所有名称.localizedName??客队所有名称.rawName
  客队得分=比赛.participants[1].result?.score??''
  客队队徽=比赛.participants[1].team.image?队徽基础地址(比赛.participants[1].team.image.id):undefined
  客队胜率=比赛.participants[1].probabilities?.winProbability
  主队点球=比赛.participants[0].result?.soccerPenalties??''
  客队点球=比赛.participants[1].result?.soccerPenalties??''
  比赛状态信息=种类?`${种类}／`:''
  switch(状态){
    case'Final':比赛状态信息+='已结束';break
    case'PreGame':比赛状态信息+=时间;break
    case'InProgress':比赛状态信息+=进行时间;break
    case'Postponed':比赛状态信息+='延期';break
    case'Suspended':比赛状态信息+='已暂停';break
    case'Cancelled':比赛状态信息+='取消';break
    case'InProgressBreak':if(进行时间=='Halftime45＇0＂'){比赛状态信息+='中场休息';break}
    case'Abandoned':比赛状态信息+='已中断';break
    default:比赛状态信息+=`${时间}${开球时间待定}${状态}${进行时间}`;break
  }
  if(主队点球&&客队点球){比赛状态信息+=`／点球 ${主队点球}··${客队点球}`}
  比赛内容='<table style=width:100%;text-align:center><tr>'
  比赛内容+=`<td width=10%><img ${主队队徽?`src=${主队队徽}`:''} style=height:25px;width:25px></td>`
  比赛内容+=`<td width=30%>${主队}</td>`
  if(主队得分&&客队得分){
    比赛内容+=`<td width=5%>${状态=='Final'&&主队得分>客队得分?`<b style=font-size:larger>${主队得分}</b>`:`<span>${主队得分}</span>`}</td>`
    比赛内容+=`<td width=10%><div style=position:relative;height:max-content>··<span style=font-size:small;position:absolute;top:75%;left:50%;transform:translate(-50%,0%);text-align:center;width:max-content>${比赛状态信息}</span></div></td>`
    比赛内容+=`<td width=5%>${状态=='Final'&&客队得分>主队得分?`<b style=font-size:larger>${客队得分}</b>`:`<span>${客队得分}</span>`}</td>`
  }else{
    比赛内容+=`<td width=20%><div style=position:relative;height:max-content><span style=font-size:small;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;width:max-content;max-width:200%>${比赛状态信息}</span></div></td>`
  }
  比赛内容+=`<td width=30%>${客队}</td>`
  比赛内容+=`<td width=10%><img ${客队队徽?`src=${客队队徽}`:''} style=height:25px;width:25px></td>`
  比赛内容+=`</tr></table><hr>`
  return[比赛内容,{队名:主队,进球数:主队得分,队徽:主队队徽},{队名:客队,进球数:客队得分,队徽:客队队徽},状态!='Final',种类=='']
}
</script>
