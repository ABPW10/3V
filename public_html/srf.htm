<script>
let 上排=false,更改={软:false,硬:false},变字=undefined,正在打字的语种键盘=undefined,前后引号={单引号:false,双引号:false}
const 打字框=document.getElementsByTagName('textarea')[0]
打字框.focus()
function 输入字符(按键,交互参数){
  if(typeof 按键==='string'){要输入的字符=按键;if(变字){清除变字()}}
  else{
  let 语种序号=Array.from(document.getElementsByClassName('键盘')).indexOf(正在打字的语种键盘)
  if(正在打字的语种键盘!==按键.parentNode.parentNode){
    正在打字的语种键盘=按键.parentNode.parentNode
    语种序号=Array.from(document.getElementsByClassName('键盘')).indexOf(正在打字的语种键盘)
    if(变字){清除变字()}
    if(书写方向[语种序号]==2){打字框.style.direction='rtl'}else{打字框.style.direction=''}
    if(书写方向[语种序号]==1){
      打字框.style.writingMode='vertical-lr'
    }else if(书写方向[语种序号]==3){
      打字框.style.writingMode='vertical-rl'
    }else{打字框.style.writingMode=''}
  }
  let 按键内容,字符;
  if(按键.children[按键.children.length-1].children.length===0||Array.from(按键.children[按键.children.length-1].children).every(按键标签=>按键标签.tagName.toLowerCase()=='font')){
    按键内容=按键.children[按键.children.length-1].textContent.split('\n')
  }else{
    按键内容=[]
    for(let 内容 of 按键.children[按键.children.length-1].children){
      按键内容.push(内容.textContent)
    }
  }
  const 大写锁定=交互参数.getModifierState("CapsLock")
  const 按了上排键=交互参数.shiftKey||上排
  if(上排){上排=false}

  const 按了更改键=更改.软||更改.硬
  if(更改.软){更改.软=false}  
  let 按键序号;
  if(按了更改键&&附加字表[语种序号]&&附加字表[语种序号][按键序号=按键分布表[语种序号].flat().indexOf(按键内容.join('\n'))]){字符=附加字表[语种序号][按键序号]}
  else if(按键内容.length==1){字符=按键内容[0];if(按了上排键==大写锁定){字符=字符.toLowerCase()}}
  else if(按了上排键){字符=按键内容[0]}else{字符=按键内容[1]}
  if(字符){
    if((字符=='\''||字符=='"')&&引号控制[语种序号]){
      if(字符=='\''&&引号控制[语种序号]%2==1){前后引号.单引号=!前后引号.单引号;字符=前后引号.单引号?'‘':'’'}
      else if(字符=='"'){前后引号.双引号=!前后引号.双引号;字符=前后引号.双引号?'“':'”'}
    }
    if(变字!==字符&&变字表[语种序号]&&变字表[语种序号][字符]&&(!变字||!变字表[语种序号][变字][字符])){准备变字(字符,语种序号);字符=undefined}
    else if(变字){字符=变字表[语种序号][变字][字符]??字符;清除变字()}
  }
  要输入的字符=字符
  }
  if(要输入的字符){const 输入原位=打字框.selectionStart
  打字框.value=打字框.value.substr(0,打字框.selectionStart)+要输入的字符+打字框.value.substr(打字框.selectionEnd)
  打字框.setSelectionRange(输入原位+要输入的字符.length,输入原位+要输入的字符.length)}
  打字框.focus();
}
function del() {
    打字框.focus();
    if(变字){清除变字();return}
    const 输入原位=打字框.selectionStart-(打字框.selectionStart==打字框.selectionEnd?1:0)
    打字框.value = 打字框.value.substr(0, 打字框.selectionStart - (打字框.selectionStart==打字框.selectionEnd?1:0))+打字框.value.substr(打字框.selectionEnd);
    打字框.setSelectionRange(输入原位,输入原位)
}
const 设定键盘高度=()=>{
  const 全部键盘=document.getElementsByClassName('键盘')
  for(键盘 of 全部键盘){
    键盘.style.height=`${键盘.clientWidth/14.5*5}px`
  }
}
document.body.onload=()=>{
设定键盘高度()
const 键盘=document.getElementsByClassName('键盘')[0]
let 语种序号=0
for(let 语种 of 按键分布表){
  let 又一键盘=键盘
  const 全部按键=(语种序号==0?键盘:(又一键盘=又一键盘.cloneNode(true))).getElementsByClassName('键')
  if(语种序号>0){键盘.parentNode.appendChild(又一键盘)}
  let 按键序号=0
  const 文字书写方向=书写方向[语种序号]
  for(let 字符 of 语种.flat()){
    let 改变方向的文字
    if(文字书写方向%2>0){
      const 候选字符=字符.split('\n')
      const 是竖写语种的字符=字符=>字符.charCodeAt(0)>=0x1800&&字符.charCodeAt(0)<=0x18AF
      改变方向的文字=候选字符.some(是竖写语种的字符)?'':undefined
      if(改变方向的文字!==undefined){
        for(let 字符选项 of 候选字符){
          改变方向的文字+=`<div${是竖写语种的字符(字符选项)?' style=transform:rotate(90deg)':''}>${字符选项}</div>`
        }
      }
    }
    全部按键[按键序号].innerHTML=附加字表[语种序号]&&附加字表[语种序号][按键序号]?`<div style=position:absolute;top:0;right:0;color:grey>${附加字表[语种序号][按键序号]}</div>`:''
    全部按键[按键序号++].innerHTML+=`<div style=position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);white-space:pre;text-align:center>${改变方向的文字??字符}</div>`
  }
  ++语种序号
}
}

const 改变了的键=[]
function 准备变字(字符,语种序号){
 if(变字!=undefined){清除变字()}  
 变字=字符
 const 全部按键=正在打字的语种键盘.getElementsByClassName('键')
 for(const 键 of 全部按键){
  let 按键内容,字符
  if(键.children[键.children.length-1].children.length===0){
    按键内容=键.children[键.children.length-1].textContent.split('\n')
  }else{
    按键内容=[]
    for(let 内容 of 键.children[键.children.length-1].children){
      按键内容.push(内容.textContent)
    }
  }
  if(按键内容.every(字符=>!字符.trim())){continue}
  const 要改变的字符=[]
  for(const 字符 of 按键内容){
    if(变字表[语种序号][变字][字符]){
      要改变的字符.push([字符,变字表[语种序号][变字][字符]])
    }
  }
  改变了的键.push([键,键.innerHTML])
  for(const 改变的字符 of 要改变的字符){
    for(const 键面 of 键.childNodes){
      for(const 键字 of 键面.childNodes){
        const 字符组=键字.textContent.split('\n')
        const 字符序号=字符组.indexOf(改变的字符[0])
        if(字符序号>=0){
          字符组.splice(字符序号,1,`<font color=blue>${改变的字符[1]}</font>`)
          键字.parentNode.innerHTML=字符组.join('\n')
        }
      }
    }
  }
 }
}
function 清除变字(){
  变字=undefined
  for(const 原字 of 改变了的键){原字[0].innerHTML=原字[1]}
  改变了的键.length=0
}

        function menuItemSelAll_Click()
        {
            richTextBox1.focus();
            richTextBox1.select(); 
        }
        function menuItemCopy_Click()
        {
            if (richTextBox1.SelectedText.length == 0)
            {
                let selStart=richTextBox1.selectionStart,selEnd=richTextBox1.selectionEnd
                richTextBox1.select();
                document.execCommand('copy')//richTextBox1.Copy();
                richTextBox1.setSelectionRange(selStart,selEnd)//DeselectAll();
                //richTextBox1.selectionStart = selStart;
            }
            else
            {
                if (!richTextBox1.Focused)
                    richTextBox1.focus();
                //richTextBox1.ScrollToCaret();
                document.execCommand('copy')//richTextBox1.Copy(); //将选择文本复制到剪切板
            }
        }
        HTMLTextAreaElement.prototype.Clear=function(){this.value='';this.focus()}
        function menuItemClear_Click()
        {
            richTextBox1.Clear();

        DialogResult={Yes:true}
        const saveFileDialog1={ShowDialog:function(){return DialogResult.OK}}
        const RichTextBoxStreamType={}
        richTextBox1.SaveFile=function(fileName,saveTypeOption){
            var aTag = document.createElement('a');
            var blob = new Blob([this.value]);
            aTag.download = fileName;
            aTag.href = URL.createObjectURL(blob);
            aTag.click();
            URL.revokeObjectURL(blob);
        }
        Date.prototype.ToString=function(){
          return this.getFullYear()+String(this.getMonth()+1).padStart(2,'0')+String(this.getDate()).padStart(2,'0')+String(this.getHours()).padStart(2,'0')+String(this.getMinutes()).padStart(2,'0')
        }
        function menuItemSave_Click()
        {
            saveFileDialog1.FileName = "输入文本" + (new Date).ToString()+".txt";
            if (saveFileDialog1.ShowDialog() == DialogResult.OK)

            {

                let fileName = saveFileDialog1.FileName;

                try

                {

                    richTextBox1.SaveFile(fileName, RichTextBoxStreamType.PlainText);

                }

                catch (ex)

                {

                    MessageBox.Show(ex.Message, "另存为", MessageBoxButtons.OK, MessageBoxIcon.Exclamation);

                }

            }

        }
