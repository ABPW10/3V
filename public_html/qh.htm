let projCtr=[110,30],投影半径=0.45,figureSizeX=图形.clientWidth,figureSizeY=图形.clientHeight,figureSize=Math.min(figureSizeX,figureSizeY)
let 站点列表=[],标注站点=()=>{}
fetch('https://weather.cma.cn/api/map/weather/1',{referrer: ""}).then(信息=>信息.json()).then(数据=>{
  站点列表=站点列表.concat(数据.data.city)
  fetch(
    'https://opendata.cwa.gov.tw/api/v1/rest/datastore/O-A0003-001?Authorization=CWB-98146E15-9BB4-46EA-95CD-31AFE31B7225&WeatherElement=Weather,Now,WindDirection,WindSpeed,AirTemperature,RelativeHumidity,AirPressure&GeoInfo=Coordinates,StationAltitude,CountyName'
  ).then(另一组信息=>另一组信息.json()).then(另一组数据=>{
  站点列表=站点列表.concat(另一组数据.records.Station.filter(站=>/^\d+$/.test(站.StationId)).map(站=>[站.StationId,站.StationName,站.GeoInfo.StationAltitude,站.StationName==='臺北'?1:站.StationName==='臺中'||站.StationName==='高雄'?2:3,站.GeoInfo.Coordinates.find(c=>c.CoordinateName==='WGS84')?.StationLatitude,站.GeoInfo.Coordinates.find(c=>c.CoordinateName==='WGS84')?.StationLongitude]));
  (标注站点=()=>{if(!站点列表){return}
  for(let 站点 of 站点列表){
    const 站号=站点[0],站名=站点[1],等级=站点[3]
    if(等级>(1-Math.log(投影半径*1000/figureSize))/1.125){continue}
    const 位置更正={'58981':[25.74,123.47],'59997':[ 9.54 , 112.88 ]}
    const [纬度,经度]=位置更正[站号]??站点.slice(4,6)
    let 点的表示
    if(!(点的表示=表示点({lat:纬度,lng:经度},站名,0,1,'red',undefined))){continue}
    const 点图层=document.createElement('g')
    点图层.innerHTML+=点的表示
    点图层.setAttribute('onclick',`显示气候(['${站号}','${站名}',${isNaN(站点[2])||站点[2]===''?undefined:站点[2]},${纬度},${经度}])`)
    图形.insertAdjacentHTML('beforeend',点图层.outerHTML)
  }
  })()
  })
})
  图表=document.body.children[0]
  图表.oncontextmenu=点击=>{点击.preventDefault();点击.stopPropagation();图表.style.display='none'}
async function getStationsInfo(){
  const res=await StationsJson()//await get(`https://data.cma.cn/dataService/ajax/act/getStationsByProvinceID/dataCode/A.0012.0001.html?provinceID=${provinceCode}0`,
            //          {headers:{"User-Agent":"."}})
  return {stations:res}
}
var stationsJson
StationsJson=async()=>{
  if(!stationsJson){stationsJson=await(await fetch('json/zdlb.json')).json()
  for(let stationInfo of stationsJson){
    let stationId=stationInfo.code,stationElev=stationInfo.height
    for(let objKey in stationInfo){
      delete stationInfo[objKey]
    }
    stationInfo.StationID=stationId
    stationInfo.V07001=stationElev
  }
  }
  return stationsJson
}
async function getStationInfo(stationCode){
  let stations=(await getStationsInfo()).stations
  if(!stations){return}
  const stationInfo = stations.find(s=>s.StationID===stationCode);
  return{高度:stationInfo?.V07001??stationInfo?.V07002}
}
let 世界气象组织站点信息
世界气象组织=async()=>世界气象组织站点信息??(世界气象组织站点信息=await(await fetch('json/wmo-zd.json')).json())
let mapElevations
MapElevations=async()=>mapElevations??(mapElevations=await(await fetch('json/dthb-cma-zd.json')).json())
查询海拔=async(站号)=>{
      站号=站号.substr(0,5)
      let elevation=(await getStationInfo(站号))?.高度
      if(elevation==undefined){
        elevation=(await 世界气象组织()).find(record=>record.attributes.station_id==站号)?.attributes.ELEVATION
        if(elevation==-999){elevation=undefined}
      }
      let elevationDescription=''
      if(elevation==undefined){
        elevation=(await MapElevations()).find(record=>record.号===站号)?.高
        elevationDescription='～ '
      }
      if(elevation!=undefined){
        return elevationDescription+Math.round(elevation)+' ｍ'
      }
    }
function 显示气候(站点){
  const 所有柱状条=Array.from(图表.getElementsByTagName('rect')).slice(1)
  //const 所有线段=Array.from(图表.getElementsByTagName('line')).slice(7)
  const [上曲线,下曲线]=图表.getElementsByTagName('path')
  const 所有点=图表.getElementsByTagName('circle')
  const 所有文字标注=图表.getElementsByTagName('text')
  const 站点号码=站点[0]
  if(站点号码.length===5||站点号码.length>6){
fetch(`http://weather.cma.cn/api/climate?stationid=${站点号码}`,{referrer: ""}).then(网络资源=>网络资源.json()).then(async 数据=>{
  if(站点号码.length>6&&!数据.data?.data){
    数据=await(await fetch(`http://weather.cma.cn/api/climate?stationid=${站点号码.substr(0,5)}`,{referrer: ""})).json()
  }
  图表.style.display='block'
  所有文字标注[0].innerHTML=`${站点[1]}　${数据.data.beginYear??''} － ${数据.data.endYear??''} 年`
  if(站点号码!='59997'&&!站点[2]){
    查询海拔(站点[0]).then(海拔=>{if(海拔==undefined){return}
      站点[2]=海拔
  所有文字标注[0].innerHTML=`${站点[1]}［ ${isNaN(站点[2])||站点[2]===''?站点[2]:Math.round(站点[2])+' ｍ'} ］${数据.data.beginYear??''} － ${数据.data.endYear??''} 年`
    })
  }
  if(!数据.data?.data){
    数据.data={data:[]}
    for(let 序号=0;序号<12;序号++){数据.data.data.push({month:序号+1,minTemp:0,maxTemp:0,rainfall:0})}
  }
  let 年累计=0,每月高值坐标=[],每月低值坐标=[]
  for(let 每月数据 of 数据.data.data){
    月份=每月数据.month-1
    所有点[月份].setAttribute('cy',10+80*((50-每月数据.maxTemp)/80)+'%')
    所有点[月份+12].setAttribute('cy',10+80*((50-每月数据.minTemp)/80)+'%')
    所有文字标注[月份+26].setAttribute('y',10+80*((50-每月数据.maxTemp)/80)+'%')
    所有文字标注[月份+26].innerHTML=每月数据.maxTemp
    所有文字标注[月份+38].setAttribute('y',10+80*((50-每月数据.minTemp)/80)+'%')
    所有文字标注[月份+38].innerHTML=每月数据.minTemp
    /*if(月份<11){
      所有线段[月份].setAttribute('y1',10+80*((50-每月数据.maxTemp)/80)+'%')
      所有线段[月份+11].setAttribute('y1',10+80*((50-每月数据.minTemp)/80)+'%')
    }
    if(月份>0){
      所有线段[月份-1].setAttribute('y2',10+80*((50-每月数据.maxTemp)/80)+'%')
      所有线段[月份+10].setAttribute('y2',10+80*((50-每月数据.minTemp)/80)+'%')
    }*/
    每月高值坐标.push(10+80*((50-每月数据.maxTemp)/80))
    每月低值坐标.push(10+80*((50-每月数据.minTemp)/80))
    所有柱状条[月份].setAttribute('y',(90-80*(每月数据.rainfall/800))+'%')
    所有柱状条[月份].setAttribute('height',80*(每月数据.rainfall/800)+'%')
    所有文字标注[月份+14].setAttribute('y',(90-80*(每月数据.rainfall/800))+'%')
    所有文字标注[月份+14].innerHTML=每月数据.rainfall
    年累计+=parseFloat(每月数据.rainfall)
  }
  计算曲线值(上曲线,每月高值坐标,图表.clientWidth,图表.clientHeight)
  计算曲线值(下曲线,每月低值坐标,图表.clientWidth,图表.clientHeight)
  所有文字标注[13].innerHTML=`${站点[3]?.toFixed(2)} Ｎ　${站点[4]?.toFixed(2)} Ｅ　`+`年降水量：${isNaN(年累计)?'':年累计.toFixed(1)} ㎜`
})
  }else if(站点号码.length===6){
    fetch(`https://opendata.cwa.gov.tw/api/v1/rest/datastore/C-B0027-001?Authorization=CWB-98146E15-9BB4-46EA-95CD-31AFE31B7225&StationID=${站点号码}&weatherElement=AirTemperature,Precipitation`).then(网络资源=>网络资源.json()).then(async 数据=>{
  if(!站点号码.endsWith('0')&&数据.records.data.surfaceObs.location.length===0){
    数据=await(await fetch(`https://opendata.cwa.gov.tw/api/v1/rest/datastore/C-B0027-001?Authorization=CWB-98146E15-9BB4-46EA-95CD-31AFE31B7225&StationID=${站点号码.substr(0,5)}0&weatherElement=AirTemperature,Precipitation`)).json()
  }
  图表.style.display='block'
  if(数据.records.data.surfaceObs.location.length===0){
    数据.records.data.surfaceObs.location.push({
      stationObsStatistics:{
        AirTemperature:{monthly:[]},
        Precipitation:{monthly:[]}
      }
    })
    for(let 序号=0;序号<12;序号++){
      数据.records.data.surfaceObs.location[0].stationObsStatistics.AirTemperature.monthly.push({Month:序号+1,Minimum:0,Maximum:0})
      数据.records.data.surfaceObs.location[0].stationObsStatistics.Precipitation.monthly.push({Month:序号+1,Accumulation:0})
    }
  }
  const 温度起始=数据.records.data.surfaceObs.location[0].stationObsStatistics.AirTemperature.StationStartYear
  const 温度截止=数据.records.data.surfaceObs.location[0].stationObsStatistics.AirTemperature.StationEndYear
  const 雨量起始=数据.records.data.surfaceObs.location[0].stationObsStatistics.Precipitation.StationStartYear
  const 雨量截止=数据.records.data.surfaceObs.location[0].stationObsStatistics.Precipitation.StationEndYear
  const 资料起始=isNaN(parseInt(温度起始))?isNaN(parseInt(雨量起始))?'':雨量起始:isNaN(parseInt(雨量起始))?温度起始:Math.min(温度起始,雨量起始),
  资料截止=isNaN(parseInt(温度截止))?isNaN(parseInt(雨量截止))?'':雨量截止:isNaN(parseInt(雨量截止))?温度截止:Math.max(温度截止,雨量截止)
  所有文字标注[0].innerHTML=`${站点[1]}［ ${isNaN(站点[2])||站点[2]===''?站点[2]:Math.round(站点[2])+' ｍ'} ］${资料起始} － ${资料截止} 年`
  let 每月高值坐标=[],每月低值坐标=[]
  for(let 每月温度 of 数据.records.data.surfaceObs.location[0].stationObsStatistics.AirTemperature.monthly){
    月份=每月温度.Month-1
    所有点[月份].setAttribute('cy',10+80*((50-每月温度.Maximum)/80)+'%')
    所有点[月份+12].setAttribute('cy',10+80*((50-每月温度.Minimum)/80)+'%')
    所有文字标注[月份+26].setAttribute('y',10+80*((50-每月温度.Maximum)/80)+'%')
    所有文字标注[月份+26].innerHTML=每月温度.Maximum
    所有文字标注[月份+38].setAttribute('y',10+80*((50-每月温度.Minimum)/80)+'%')
    所有文字标注[月份+38].innerHTML=每月温度.Minimum
    /*if(月份<11){
      所有线段[月份].setAttribute('y1',10+80*((50-每月温度.Maximum)/80)+'%')
      所有线段[月份+11].setAttribute('y1',10+80*((50-每月温度.Minimum)/80)+'%')
    }
    if(月份>0){
      所有线段[月份-1].setAttribute('y2',10+80*((50-每月温度.Maximum)/80)+'%')
      所有线段[月份+10].setAttribute('y2',10+80*((50-每月温度.Minimum)/80)+'%')
    }*/
    每月高值坐标.push(10+80*((50-每月温度.Maximum)/80))
    每月低值坐标.push(10+80*((50-每月温度.Minimum)/80))
  }
  计算曲线值(上曲线,每月高值坐标,图表.clientWidth,图表.clientHeight)
  计算曲线值(下曲线,每月低值坐标,图表.clientWidth,图表.clientHeight)
  let 年累计=0
  for(let 每月降水 of 数据.records.data.surfaceObs.location[0].stationObsStatistics.Precipitation.monthly){
    月份=每月降水.Month-1
    所有柱状条[月份].setAttribute('y',(90-80*(每月降水.Accumulation/800))+'%')
    所有柱状条[月份].setAttribute('height',80*(每月降水.Accumulation/800)+'%')
    所有文字标注[月份+14].setAttribute('y',(90-80*(每月降水.Accumulation/800))+'%')
    所有文字标注[月份+14].innerHTML=每月降水.Accumulation
    年累计+=parseFloat(每月降水.Accumulation)
  }
  所有文字标注[13].innerHTML=`${站点[3]?.toFixed(2)} Ｎ　${站点[4]?.toFixed(2)} Ｅ　`+`年降水量：${isNaN(年累计)?'':年累计.toFixed(1)} ㎜`
    })
  }
  
  function 计算曲线值(曲线,相对坐标序列,全图宽,全图高){
    const 纵坐标=相对坐标序列.map(比例=>全图高*比例/100.0)
    const 横坐标=[10 + 80/24,10 + 80/8,10 + 80*5/24,10 + 80*7/24,10 + 80*3/8,10 + 80*11/24,
                      90 - 80*11/24,90 - 80*3/8,90 - 80*7/24,90 - 80*5/24,90 - 80/8,90 - 80/24]
                      .map(百分比值=>全图宽*百分比值/100.0)
    const 斜率和横坐标差=[]
    for(let 序号=0;序号<12;序号++){
      const 前一个序号=序号===0?11:序号-1
      const 后一个序号=(序号+1)%12
      const 横坐标差=横坐标[后一个序号]-横坐标[前一个序号]+(序号===0||序号===11?全图宽*0.8:0)
      const 前横坐标=横坐标[前一个序号]-(序号===0?全图宽*0.8:0)
      const 后横坐标=横坐标[后一个序号]+(序号===11?全图宽*0.8:0)
      const 一次项系数=((纵坐标[前一个序号]-纵坐标[序号])*(横坐标[序号]*横坐标[序号]-后横坐标*后横坐标)-(纵坐标[序号]-纵坐标[后一个序号])*(前横坐标*前横坐标-横坐标[序号]*横坐标[序号]))
                        /((前横坐标-横坐标[序号])*(横坐标[序号]*横坐标[序号]-后横坐标*后横坐标)-(横坐标[序号]-后横坐标)*(前横坐标*前横坐标-横坐标[序号]*横坐标[序号]))
      const 二次项系数=(纵坐标[前一个序号]-纵坐标[序号]-一次项系数*(前横坐标-横坐标[序号]))/(前横坐标*前横坐标-横坐标[序号]*横坐标[序号])
      斜率和横坐标差.push([2*二次项系数*横坐标[序号]+一次项系数,横坐标差])
    }
    const 控制点=[]
    for(let 序号=0;序号<12;序号++){
      const 前控制点横坐标=横坐标[序号]+斜率和横坐标差[序号][1]/8
      const 前控制点纵坐标=纵坐标[序号]+斜率和横坐标差[序号][0]*斜率和横坐标差[序号][1]/8
      const 后控制点横坐标=横坐标[序号]-斜率和横坐标差[序号][1]/8
      const 后控制点纵坐标=纵坐标[序号]-斜率和横坐标差[序号][0]*斜率和横坐标差[序号][1]/8
      控制点.push([[后控制点横坐标,后控制点纵坐标],[前控制点横坐标,前控制点纵坐标]])
    }
    曲线串=''
    for(let 序号=0;序号<12;序号++){
      if(序号==0){曲线串+='M '
        曲线串+=`${横坐标[序号]} ${纵坐标[序号]} `
        曲线串+=`C ${控制点[序号][1][0]} ${控制点[序号][1][1]}, `
      }else{if(序号>1){曲线串+='S '}
        曲线串+=`${控制点[序号][0][0]} ${控制点[序号][0][1]}, `
        曲线串+=`${横坐标[序号]} ${纵坐标[序号]} `
      }
    }
    曲线.setAttribute('d',曲线串)
  }
}

function 表示点(坐标,标注,标注位置,显示点,颜色,样式类名=undefined){
      let projPos=offset(坐标.lat,坐标.lng,projCtr[1],projCtr[0]);
      projPos[0]=Math.round((figureSizeX+projPos[0]/投影半径*figureSize)/2)
      projPos[1]=Math.round((figureSizeY-projPos[1]/投影半径*figureSize)/2)
      if(projPos[0]<0||projPos[0]>图形.clientWidth||projPos[1]<0||projPos[1]>图形.clientHeight){return}
        let 点表示=显示点?`<path class="${样式类名?样式类名:''}" stroke=${颜色} stroke-linecap=round d=M${projPos[0]},${projPos[1]}Z stroke-width=7></path>`:''
        点表示 += `<text class="annotation${显示点?'':样式类名?' '+样式类名:''}" fill=${颜色} x=${projPos[0]} y=${projPos[1]} text-anchor=middle dy=${projPos[1]<=figureSizeY/2?'-6':'16'}>${标注}</text>`
        return 点表示
}
画图=()=>{图形.innerHTML=''}
(async()=>{const provinces=(await(await fetch('json/xzqhsheng.json')).json()).features;
  (画图=()=>{let 省份形状=图形.innerHTML='';figureSizeX=图形.clientWidth,figureSizeY=图形.clientHeight,figureSize=Math.min(figureSizeX,figureSizeY)
  for(let prov of provinces){
                  let g=document.createElement('g');
                  if(prov.geometry.type==='MultiLineString'){drawOutline(prov.geometry.coordinates,'darkseagreen',g)}
                  else if(prov.geometry.type==='MultiPolygon'){drawShape(prov.geometry.coordinates,'lightgoldenrodyellow',g,'darkseagreen')}
                  省份形状+=g.outerHTML
  }
  图形.insertAdjacentHTML('beforeend',省份形状)
  })()
})()
function 平移(方向,点击){
  const 系数=点击.shiftKey?60:20
  const 原中心=[projCtr[0],projCtr[1]]
  if(方向==='◀'||方向==='◤'||方向==='◣'){
    projCtr[0]-=Math.min(投影半径*系数/Math.cos(projCtr[1]/180*Math.PI),180)
    if(projCtr[0]<-180){projCtr[0]+=360}
  }
  if(方向==='▲'||方向==='◤'||方向==='◥'){
    projCtr[1]+=投影半径*系数;if(projCtr[1]>90){projCtr[1]=90}
  }
  if(方向==='▼'||方向==='◣'||方向==='◢'){
    projCtr[1]-=投影半径*系数;if(projCtr[1]<-90){projCtr[1]=-90}
  }
  if(方向==='▶'||方向==='◥'||方向==='◢'){
    projCtr[0]+=Math.min(投影半径*系数/Math.cos(projCtr[1]/180*Math.PI),180)
    if(projCtr[0]>180){projCtr[0]-=360}
  }
  if(projCtr[0]!=原中心[0]||projCtr[1]!=原中心[1]){画图();标注站点()}
}
function 缩放(增减){
  const 原半径=投影半径
  if(增减==='＋'){let 缩小半径=投影半径/2;if(figureSize/缩小半径<100000){投影半径=缩小半径}}
  else if(增减==='－'){let 扩大半径=投影半径*2;if(figureSize/扩大半径>500){投影半径=扩大半径}}
  if(投影半径!=原半径){画图();标注站点()}
}
