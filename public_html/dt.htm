<script>
    now=new Date;
    year=now.getFullYear();
    start=new Date(year,0);
    dayInYear=(now-start)/86400000;
    dayAfterSpringEquinox=2*Math.PI*(dayInYear+1-81)/364;
    equationOfTime=9.87*Math.sin(2*dayAfterSpringEquinox)-7.53*Math.cos(dayAfterSpringEquinox)-1.5*Math.sin(dayAfterSpringEquinox);
    dayAfterSpringEquinoxAccurate=2*Math.PI*(dayInYear+1-79.6764-0.2422*(year-1985)+parseInt((year-1985)/4))/365.2422;
    sunLat=-(0.3723+23.2567*Math.sin(dayAfterSpringEquinoxAccurate)+0.1149*Math.sin(2*dayAfterSpringEquinoxAccurate)-0.1712*Math.sin(3*dayAfterSpringEquinoxAccurate)-0.758*Math.cos(dayAfterSpringEquinoxAccurate)+0.3656*Math.cos(2*dayAfterSpringEquinoxAccurate)+0.0201*Math.cos(3*dayAfterSpringEquinoxAccurate));
    sunLatRad=sunLat*Math.PI/180;
    function sunlights(lat,lng,tz){
        h=0;
        degInLng=lng.indexOf("°");
        minInLng=lng.indexOf("'");
        secInLng=lng.indexOf("\"");
        negativeInLng=lng.indexOf("-");
        isDegMinSecLng=degInLng>-1||minInLng>-1||secInLng>-1;
        degValLng=parseFloat(lng);
        degMinSecLng=((degInLng>-1?Math.abs(parseFloat(lng.substr(0,degInLng))):0)+(minInLng>-1?Math.abs(parseFloat(lng.substr(degInLng>-1?degInLng+1:0,degInLng>-1?minInLng-degInLng-1:minInLng)))/60:0)+(secInLng>-1?Math.abs(parseFloat(lng.substr(minInLng>-1?minInLng+1:degInLng>-1?degInLng+1:0,minInLng>-1?secInLng-minInLng-1:degInLng>-1?secInLng-degInLng-1:secInLng)))/3600:0));
        lngVal=h>=-6378000?isDegMinSecLng?(negativeInLng>-1?negativeInLng==0?-1:0:1)*degMinSecLng:degValLng:negativeInLng>-1?negativeInLng==0?(isDegMinSecLng?-degMinSecLng:degValLng)+180:0:(isDegMinSecLng?degMinSecLng:degValLng)-180;
        
        hTZ=parseFloat(tz);
        negativeInTZ=tz.indexOf("-");
        timeSeparatorPos1=tz.indexOf(":");
        timeSeparatorPos2=tz.indexOf(":",timeSeparatorPos1+1);
        hVal=Math.abs(parseFloat(tz.substr(0,timeSeparatorPos1)));
        minVal=Math.abs(parseFloat(timeSeparatorPos2>-1?tz.substr(timeSeparatorPos1+1,timeSeparatorPos2-timeSeparatorPos1-1):tz.substr(timeSeparatorPos1+1)))/60;
        secVal=timeSeparatorPos2>-1?Math.abs(parseFloat(tz.substr(timeSeparatorPos2+1)))/3600:0;
        hMinSec=hVal+minVal+secVal;
        lngEastOfTZ=(lngVal-15*(timeSeparatorPos1>-1?(negativeInTZ>-1?negativeInTZ==0?-1:0:1)*hMinSec:hTZ))%360;
        minsAheadOfTZ=tz==""?0:(lngEastOfTZ>=180?lngEastOfTZ-360:lngEastOfTZ)/15*60;
        
        totalOffsetOfNoonMin=minsAheadOfTZ+equationOfTime;
        totalOffsetOfNoonDay=totalOffsetOfNoonMin/1440;
        totalOffsetOfNoonMS=totalOffsetOfNoonDay*86400000;
        noon=new Date(now).setHours(12,0,0,0);
        localNoonOnDay=new Date(noon-totalOffsetOfNoonMS);

        degInLat=lat.indexOf("°");
        minInLat=lat.indexOf("'");
        secInLat=lat.indexOf("\"");
        negativeInLat=lat.indexOf("-");
        isDegMinSecLat=degInLat>-1||minInLat>-1||secInLat>-1;
        negativeMultiplier=negativeInLat>-1?negativeInLat==0?-1:0:1;
        degLat=degInLat>-1?Math.abs(parseFloat(lat.substr(0,degInLat))):0;
        minLat=minInLat>-1?Math.abs(parseFloat(lat.substr(degInLat>-1?degInLat+1:0,degInLat>-1?minInLat-degInLat-1:minInLat)))/60:0;
        secLat=secInLat>-1?Math.abs(parseFloat(lat.substr(minInLat>-1?minInLat+1:degInLat>-1?degInLat+1:0,minInLat>-1?secInLat-minInLat-1:degInLat>-1?secInLat-degInLat-1:secInLat)))/3600:0;
        degValLat=parseFloat(lat);
        degMinSecLat=degLat+minLat+secLat;
        latValOriginal=isDegMinSecLat?negativeMultiplier*degMinSecLat:degValLat;
        latVal=h>=-6378000?-latValOriginal:latValOriginal;
        
        latRad=latVal*Math.PI/180;
        
        function timeInDayByAngle(elevAng){
            elevAngRad=elevAng*Math.PI/180;
            elevAngOffsetFromNoon=(Math.sin(elevAngRad)-Math.sin(latRad)*Math.sin(sunLatRad))/(Math.cos(latRad)*Math.cos(sunLatRad));
            elevAngTimeOffsetFromNoonDay=elevAngOffsetFromNoon>1?undefined:elevAngOffsetFromNoon<-1?undefined:Math.acos(elevAngOffsetFromNoon)/(2*Math.PI);
            elevAngTimeOffsetFromNoonMS=elevAngOffsetFromNoon>1?undefined:elevAngOffsetFromNoon<-1?undefined:elevAngTimeOffsetFromNoonDay*86400000;
            elevAngTimeInDayFirst=elevAngOffsetFromNoon>1?undefined:elevAngOffsetFromNoon<-1?undefined:new Date(localNoonOnDay-elevAngTimeOffsetFromNoonMS).toLocaleTimeString(undefined,{hour12:false});
            elevAngTimeInDaySecond=elevAngOffsetFromNoon>1?undefined:elevAngOffsetFromNoon<-1?undefined:new Date(localNoonOnDay-(-elevAngTimeOffsetFromNoonMS)).toLocaleTimeString(undefined,{hour12:false});
            return [elevAngTimeInDayFirst,elevAngTimeInDaySecond];
        }

        sunriseSunset=timeInDayByAngle(-51/60);
        cTwilights=timeInDayByAngle(-6);
        nTwilights=timeInDayByAngle(-12);
        aTwilights=timeInDayByAngle(-18);

        return{
            天文曙光:aTwilights[0],
            航海曙光:nTwilights[0],
            可视曙光:cTwilights[0],
            日出:sunriseSunset[0],
            日落:sunriseSunset[1],
            可视暮光:cTwilights[1],
            航海暮光:nTwilights[1],
            天文暮光:aTwilights[1]
        }
    }
</script>

    function numberToColour(number,name){
      return(name==='t'?temToC:name==='r'?rainfallToC:name==='w'?windspeedToC:()=>'')(number)

    function rainfallToC(rf){
      const colourValues = [
        [1.25,  173,216,230],
        [5.25,  95, 158,160],
        [12,    30, 144,255],
        [20,    65, 105,225],
        [37.5,  0,  0,  255],
        [75,    0,  0,  139]
      ]
      for (let i = 0; i < colourValues.length; i++ ) {
        if (i === 0 && rf < colourValues[i][0]) {
          return `rgb(${colourValues[i].slice(1)})`;
        } else if (i > 0 && rf < colourValues[i][0] && rf >= colourValues[i - 1][0]) {
          const coef = (rf - colourValues[i - 1][0])/(colourValues[i][0] - colourValues[i - 1][0])
          const r = Math.round(colourValues[i - 1][1] + coef*(colourValues[i][1] - colourValues[i - 1][1]))
          const g = Math.round(colourValues[i - 1][2] + coef*(colourValues[i][2] - colourValues[i - 1][2]))
          const b = Math.round(colourValues[i - 1][3] + coef*(colourValues[i][3] - colourValues[i - 1][3]))
          return `rgb(${r},${g},${b})`;
        } else if (i === colourValues.length - 1 && rf >= colourValues[i][0]) {
          return `rgb(${colourValues[i].slice(1)})`;
        }
      }
    }
    function windspeedToC(ws){return levelToColour(windSpeedToLevel(ws))}

        const indexKeyFirst=stationNumber.substr(0,2)
        const indexKeySecond=stationNumber[2]
        const itemValue=stationNumber.substr(3,2)
        let indexationResultFirst,indexationResultSecond,indexationResultFirstName,indexationResultSecondName
        let stationNameAsCharCode=''
        for(let charIndex=0;charIndex<fs[0].length;charIndex++){
          stationNameAsCharCode+=fs[0].charCodeAt(charIndex)
        }
        const indexKeyFirstName=stationNameAsCharCode.substr(0,2)
        const indexKeySecondName=stationNameAsCharCode[2]
        const itemValueName=stationNameAsCharCode.substr(3)
        const checkProximity=(lat,lon)=>{
          const latInPercent=Math.round(lat*10)
          const lonInPercent=Math.round(lon*10)
          const offsets=[-1,0,1]
          for(let xOffset of offsets){
            for(let yOffset of offsets){
              const itemValueCoords=`${latInPercent+xOffset}`
              const stationLonInPercent=`${lonInPercent+yOffset}`
              const indexKeyFirstCoords=stationLonInPercent.substr(0,stationLonInPercent.length-1)
              const indexKeySecondCoords=stationLonInPercent.substr(stationLonInPercent.length-1)
              let indexationResultFirstCoords,indexationResultSecondCoords,finalIndexationResult
              if((indexationResultFirstCoords=indicesOfStationCoords[indexKeyFirstCoords])
                  &&(indexationResultSecondCoords=indexationResultFirstCoords[indexKeySecondCoords])
                  &&(finalIndexationResult=indexationResultSecondCoords[itemValueCoords])
                  &&finalIndexationResult.every(coord=>map.distance(coord,[lat,lon])<13000)){
                return true
              }
            }
          }
          return false
        }
        if((!(indexationResultFirst=indicesOfRealStations[indexKeyFirst])
            ||!(indexationResultSecond=indexationResultFirst[indexKeySecond])
            ||!indexationResultSecond[itemValue])
            &&(!(indexationResultFirstName=indicesOfRealStationNames[indexKeyFirstName])
            ||!(indexationResultSecondName=indexationResultFirstName[indexKeySecondName])
            ||!indexationResultSecondName[itemValueName])
            &&!checkProximity(fs[3],fs[2])){
          fetch(`http://www.nmc.cn/rest/real/${stationNumber}`).then(async condition=>{
          try{condition=await condition.json()}catch(ex){condition=undefined}
          if(condition&&validateTime(condition.publish_time)){
            condition=undefined
          }
          let t,p,d,w,h,r,i;
          if(condition){
            t=condition.weather?.temperature
            p=condition.weather?.airpressure
            d=condition.wind?.degree
            w=condition.wind?.speed
            h=condition.weather?.humidity
            r=condition.weather?.rain
            i=condition.weather?.info
          }
          
          let pt,pp,pd,pw,ph,pr;
          if(!condition||t===undefined){
            [pt,pp,pd,pw,ph,pr]=await readPassedChart(stationNumber)
          }
          
          t=t!==undefined&&t!=9999?t:pt?pt:undefined
          p=p!==undefined&&p!=9999?p:pp?pp:undefined
          d=d!==undefined&&d!=9999?d:pd?pd:undefined
          w=w!==undefined&&w!=9999?w:pw?pw:undefined
          h=h!==undefined&&h!=9999?h:ph?ph:undefined
          r=r!==undefined&&r!=9999?r:pr?pr:undefined
          i=i!==undefined&&i!=='-'?i:undefined

          writeMap(t,p,d,w,h,r)
          }).catch(async e=>{
            let [t,p,d,w,h,r]=await readPassedChart()
            writeMap(t,p,d,w,h,r)
          })
          const readPassedChart=async()=>{
          let passed
          let pt,pp,pd,pw,ph,pr;
          if(stationNumber===paramsNansha.s){passed=await NanshaConditionResponse()}
          else{
          passed=await fetch(`http://www.nmc.cn/rest/passed/${stationNumber}`)
          try{passed=await passed.json()}catch(ex){passed=undefined}
          }
          if(passed){
            if(validateTime(passed[0].time)){
              passed=undefined
            }
          }
          if(passed){
          pt=passed.find(passedTime=>passedTime.temperature!=9999)?.temperature
          pp=passed.find(passedTime=>passedTime.pressure!=9999)?.pressure
          pd=passed.find(passedTime=>passedTime.windDirection!=9999)?.windDirection
          pw=passed.find(passedTime=>passedTime.windSpeed!=9999)?.windSpeed
          ph=passed.find(passedTime=>passedTime.humidity!=9999)?.humidity
          pr=passed.find(passedTime=>passedTime.rain1h!=9999)?.rain1h
          }
          return [pt,pp,pd,pw,ph,pr]
          }
          const writeMap=(t,p,d,w,h,r)=>{
          let otherStation
          if(t!==undefined){
            otherStation={s:stationNumber,l:[fs[3],fs[2]],c:fs[0],t};
            if(stationNumber===paramsNansha.s){otherStation.l=paramsNansha.l}
            if(p!==undefined){otherStation.p=p}
            if(d!==undefined){otherStation.d=d}
            if(w!==undefined){otherStation.w=w}
            if(h!==undefined){otherStation.h=h}
            if(r!==undefined){otherStation.r=r}
            addAllRealsToMap([otherStation])
            allReals.push(otherStation)
          }
          }
        }
      }

      addAllRealsToMap(otherCwaStations=await getOtherCwaStations())
      allReals=allReals.concat(otherCwaStations)
    };

    async function getAll(){

        const stationNumber=s[5];
        let indexKeyFirst=stationNumber.substr(0,2)
        let indexKeySecond=stationNumber[2]
        let itemValue=stationNumber.substr(3,2)
        let indexationResultFirst,indexationResultSecond
        if(!(indexationResultFirst=indicesOfRealStations[indexKeyFirst])){
          indexationResultFirst=indicesOfRealStations[indexKeyFirst]={}
        }
        if(!(indexationResultSecond=indexationResultFirst[indexKeySecond])){
          indexationResultSecond=indexationResultFirst[indexKeySecond]={}
        }
        if(!indexationResultSecond[itemValue]){
          indexationResultSecond[itemValue]={}
        }
        let stationNameAsCharCode=''
        for(let charIndex=0;charIndex<s[0].length;charIndex++){
          stationNameAsCharCode+=s[0].charCodeAt(charIndex)
        }
        indexKeyFirst=stationNameAsCharCode.substr(0,2)
        indexKeySecond=stationNameAsCharCode[2]
        itemValue=stationNameAsCharCode.substr(3)
        if(!(indexationResultFirst=indicesOfRealStationNames[indexKeyFirst])){
          indexationResultFirst=indicesOfRealStationNames[indexKeyFirst]={}
        }
        if(!(indexationResultSecond=indexationResultFirst[indexKeySecond])){
          indexationResultSecond=indexationResultFirst[indexKeySecond]={}
        }
        if(!indexationResultSecond[itemValue]){
          indexationResultSecond[itemValue]={}
        }
        itemValue=`${Math.round(s[2]*10)}`
        const stationLonInPercent=`${Math.round(s[3]*10)}`
        indexKeyFirst=stationLonInPercent.substr(0,stationLonInPercent.length-1)
        indexKeySecond=stationLonInPercent.substr(stationLonInPercent.length-1)
        let finalIndexationResult

    async function getAllCwa(){
      const retList=[]
      for(let s of await CWAStationResponse()){
        if(/^\d+$/.test(s.StationId)){
          const WGS84=s.GeoInfo.Coordinates.find(c=>c.CoordinateName==='WGS84')
          if(WGS84){
            const weathers=s.WeatherElement
            retList.push({c:s.StationName,
                l:WGS84?[WGS84.StationLatitude,WGS84.StationLongitude]:undefined,
                r:weathers.Now.Precipitation,t:+weathers.AirTemperature,h:weathers.RelativeHumidity,p:weathers.AirPressure,d:weathers.WindDirection,w:weathers.WindSpeed})
            let stationsOfCounty;
            if(!(stationsOfCounty=countiesToCwaStations[s.GeoInfo.CountyName])){
              stationsOfCounty=countiesToCwaStations[s.GeoInfo.CountyName]=[]
            }
            stationsOfCounty.push(s.StationName)
          }
        }
      }
      return retList
    }

    async function getOtherCwaStations(){
      CwaCities=['桃園市','彰化','屏東','苗栗','宜蘭','臺東','雲林','南投','花蓮']
      CwaCitiesAlternativeNames={雲林:'斗六'}
      CwaSpecialLandmarks=['日月潭','玉山','恆春','蘭嶼']
      let otherCwaStations=[]
      for(let city of CwaCities){
        const cityFullName=city.endsWith('市')?city:city+'縣'
        const stationsOfCity=countiesToCwaStations[cityFullName]
        const isLandMark=stationName=>CwaSpecialLandmarks.some(lm=>stationName.includes(lm))
        if(!stationsOfCity||stationsOfCity.every(s=>isLandMark(s))){
          otherCwaStations.push(city);
          let cityAlternativeName
          if(cityAlternativeName=CwaCitiesAlternativeNames[city]){
            otherCwaStations.push(cityAlternativeName)
          }
        }
      }
      let otherStationResults=(await(await fetch(
          `https://opendata.cwa.gov.tw/api/v1/rest/datastore/O-A0001-001?Authorization=CWB-98146E15-9BB4-46EA-95CD-31AFE31B7225&StationName=${otherCwaStations}&WeatherElement=Weather,Now,WindDirection,WindSpeed,AirTemperature,RelativeHumidity,AirPressure&GeoInfo=Coordinates,StationAltitude`
        )).json()).records.Station
      let retList=[]
      for(let s of otherStationResults){
        const WGS84=s.GeoInfo.Coordinates.find(c=>c.CoordinateName==='WGS84')
        if(WGS84){
          const weathers=s.WeatherElement
          retList.push({c:s.StationName,
              l:WGS84?[WGS84.StationLatitude,WGS84.StationLongitude]:undefined,
              r:weathers.Now.Precipitation,t:+weathers.AirTemperature,h:weathers.RelativeHumidity,p:weathers.AirPressure,d:weathers.WindDirection,w:weathers.WindSpeed})
        }
      }
      let itemsToRemove=[]
      for(let ret of retList){
        if(otherCwaStations.includes(ret.c)&&retList.find(r=>r.c===CwaCitiesAlternativeNames[ret.c])){
          retList.splice(retList.indexOf(CwaCitiesAlternativeNames[ret.c]),1)
        }
      }
      return retList
    }}}

                        objInfoComp=new ObjInfoWindowContents({
                            propsData:{data:properties}
                        });
                        objInfoComp.$mount();
                        objInfoWindowContents=objInfoComp.$el;
                        updateInformationWindow(objInfoWindowContents);
                    }
                });
            dataControl.changeTracker.setChange()
            
            function updateInformationWindow(contents){
                document.getElementById('infowindowdock').innerHTML='';
                document.getElementById('infowindowdock').appendChild(contents);
                for(let key in properties){
                    if(Array.isArray(properties[key])){
                        const addSelector=document.getElementById('infowindowdock').getElementsByClassName('add')[0];
                        const propertyName=key;
                        addSelector.onclick=function(){
                            layer.properties[propertyName].push({
                                类别:classes[0],
                                首班:'T00:00:00',
                                末班:'T00:00:00'
                            });
                            const layerProperties=JSON.parse(JSON.stringify(layer.properties));
                            processProperties(layerProperties);
                            createObjectInfoWindowContents(layer,layerProperties,true);
                            processItemAddEvent(layer,propertyName);
                        };
                        for (var i=0;i<properties[key].length;i++)
                        {
                            const propertyItem=properties[key][i];
                            const itemIndex=i;
                            for(let field in propertyItem){
                                const element=document.getElementById('infowindowdock').querySelectorAll(`.${field}.item-${i}`)[0];
                                const configName=field;
                                if(!element){
                                    return;
                                }
                                if(element.tagName.toLowerCase()=='select'){
                                    element.addEventListener('change', function(){
                                        layer.properties[propertyName][itemIndex][configName]=element.options[element.selectedIndex].text;
                                        const layerProperties=JSON.parse(JSON.stringify(layer.properties));
                                        processProperties(layerProperties);
                                        createObjectInfoWindowContents(layer,layerProperties);
                                    }, false);
                                }
                                else if (element.tagName.toLowerCase()=='input'&&element.type=='time'){
                                    element.onchange=function(){
                                        layer.properties[propertyName][itemIndex][configName]=new Date(new Date().setUTCHours(element.value.substring(0,2),element.value.substring(3,5),0)).toISOString().substring(10,19);
                                        const layerProperties=JSON.parse(JSON.stringify(layer.properties));
                                        processProperties(layerProperties);
                                        createObjectInfoWindowContents(layer,layerProperties);
                                    }
                                }
                            }
                            const removeSelector=document.getElementById('infowindowdock').querySelectorAll(`.remove.item-${i}`)[0];
                            removeSelector.onclick=function(){
                                layer.properties[propertyName].splice(itemIndex,1);
                                const layerProperties=JSON.parse(JSON.stringify(layer.properties));
                                processProperties(layerProperties);
                                createObjectInfoWindowContents(layer,layerProperties,true);
                                processItemRemEvent(layer,propertyName);
                            };
                        }
                    }
                    else{
                        const element=document.getElementById('infowindowdock').getElementsByClassName(key)[0];
                        const propertyName=key;
                        if(!element){
                            return;
                        }
                        if (element.tagName.toLowerCase()=='input'&&element.type=='number'||element.tagName.toLowerCase()=='textarea'){
                            element.onchange=function(){
                                layer.properties[propertyName]=element.value;
                                const layerProperties=JSON.parse(JSON.stringify(layer.properties));
                                processProperties(layerProperties);
                                createObjectInfoWindowContents(layer,layerProperties);
                                processTextChangeEvent(layer,propertyName);
                            };
                        }
                    }
                }
            }
    }

    const distanceDisplay=document.getElementById('distancedisplay');
    function getDistance(lyr){
        layerLatLngs=lyr.getLatLngs()
        let totalDistance=0;
        let lastLatLng=layerLatLngs[0];
        for(let latlngIndex=1;latlngIndex<layerLatLngs.length;latlngIndex++){
          const latlng=layerLatLngs[latlngIndex];
          totalDistance+=map.distance([lastLatLng.lat,lastLatLng.lng],[latlng.lat,latlng.lng]);
          lastLatLng=latlng;
        }
        return {totalDistance:totalDistance,lastLatLng:lastLatLng};
    }
    function distanceToStr(d){
        let dInKM=d/1000.0
        if(dInKM<1){d+='米'}
        else{d=dInKM+'千米'}
        return d
    }
    let showDistanceOnMove
    map.on('pm:drawstart',e=>{
      distanceDisplay.innerHTML=''
      raiseInfoWindowDock(false)
      if(e.shape!='Line'){return}
      const layer=e.workingLayer
      map.on('mousemove',showDistanceOnMove=e=>{
        const distanceResults=getDistance(layer)
        if(distanceResults.lastLatLng){
          distanceDisplay.innerHTML='路线总长：'+distanceToStr(distanceResults.totalDistance+map.distance([distanceResults.lastLatLng.lat,distanceResults.lastLatLng.lng],[e.latlng.lat,e.latlng.lng]));
          raiseInfoWindowDock(true)
        }
      })
    })
    map.on('pm:drawend',e=>{map.once('click',()=>{distanceDisplay.innerHTML='';raiseInfoWindowDock(false)});if(e.shape==='Line'){map.off('mousemove',showDistanceOnMove)}})
    map.on('pm:create',updateLength=e=>{
      const layer=e.layer;if(!(layer instanceof L.Polyline)){return}
      distanceDisplay.innerHTML='路线总长：'+distanceToStr(getDistance(layer).totalDistance);raiseInfoWindowDock(true)
      layer.on('pm:markerdrag pm:vertexremoved',()=>{distanceDisplay.innerHTML='路线总长：'+distanceToStr(getDistance(layer).totalDistance);raiseInfoWindowDock(true)})
      layer.on('pm:disable',()=>{distanceDisplay.innerHTML='';raiseInfoWindowDock(false)})
    })

<script>
    function temToC(t){
      const colourValues = [
        [-30, 0,  0,  139],
        [-15, 0,  0,  255],
        [-5,  173,216,230],
        [5,   144,238,144],
        [16,  247,247,103],
        [28.5,255,165,0],
        [43,  255,0,  0]
      ]
      for (let i = 0; i < colourValues.length; i++ ) {
        if (i === 0 && t < colourValues[i][0]) {
          return `rgb(${colourValues[i].slice(1)})`;
        } else if (i > 0 && t < colourValues[i][0] && t >= colourValues[i - 1][0]) {
          const coef = (t - colourValues[i - 1][0])/(colourValues[i][0] - colourValues[i - 1][0])
          const r = Math.round(colourValues[i - 1][1] + coef*(colourValues[i][1] - colourValues[i - 1][1]))
          const g = Math.round(colourValues[i - 1][2] + coef*(colourValues[i][2] - colourValues[i - 1][2]))
          const b = Math.round(colourValues[i - 1][3] + coef*(colourValues[i][3] - colourValues[i - 1][3]))
          return `rgb(${r},${g},${b})`;
        } else if (i === colourValues.length - 1 && t >= colourValues[i][0]) {
          return `rgb(${colourValues[i].slice(1)})`;
        }
      }
    }

    function weatherToSymbol(wea){
        if(wea.includes('雪')||wea.includes('冻雨')){
            return '❄'
        }else if(wea.includes('雷')){
            return '⛈'
        }else if(wea.includes('雨')){
            return (navigator.platform=='Win32'||navigator.platform=='Windows')&&navigator.userAgent.indexOf("Windows NT 10.0")==-1?'<span style="font-family: Noto Color Emoji;">🌧️</span>':'🌧️'
        }else if(wea.includes('沙')||wea.includes('尘')){
            if(wea.includes('沙尘暴')){
                return '<s>&nbsp;S&nbsp;</s>'
            }else if(wea.includes('扬沙')){
                return '$'
            }
            return '🇸'
        }else if(wea.includes('霾')){
            return '∞'
        }else if(wea.includes('雾')||wea.includes('霧')||wea.includes('靄')){
            return '≡'
        }else if(wea.includes('晴')){
            return '☀'
        }else if(wea.includes('多云')||wea.includes('多雲')){
            return '⛅'
        }else if(wea.includes('阴')||wea.includes('陰')){
            return '☁'
        }
        return ' '+wea+' '
    }

<script>
tcTracksOpen=false
let tySel;
function raiseInfoWindowDock(raise){
  if(!tcTracksOpen){return}
  const infoWindowDock=document.getElementById('infowindowdock')

  infoWindowDock.classList.remove(`infoWindowDock${raise?'First':'Second'}LevelUp`)

function openTCTracks(){
    if(tcTracksOpen){
      let infoWindow=document.getElementById('infowindowdock');
      infoWindow.innerHTML='';
      infoWindow.appendChild(tySel);
      return
    }
    tcTracksOpen=true;
    document.title='台风路径';
    location.hash='tflj'
    map.attributionControl.addAttribution('<a href="https://www.typhoon.org.cn/">中国气象局</a><a href="http://www.nmc.cn/">中央气象台</a>');
    if(region){

      objLyrs.地图.options=defaultLyrRoad.options;
      objLyrs.地图.setUrl(defaultLyrRoad._url)
      if(originalZoom%1!==0){map.getZoom=originalGetZoom;map.setZoom(originalZoom)}
    }
    map.setView([27,140], 4);
    map.off('pm:create',enableConfiguration);
    map.removeControl(dataControl);
    setTimeout(()=>{TCTrackPlotAPI.tcLayersToggle=L.control.layers().addTo(map);},1)

    const WarningLine24 = [
        [34, 127],
        [25, 127],
        [5, 117]
    ];
    const WarningLine48 = [
        [33, 132],
        [22, 132],
        [10, 125],
        [0, 120]
    ];
    L.polyline(WarningLine24, {color:'yellow', weight:1}).addTo(map);
    L.polyline(WarningLine48, {color:'yellow', weight:1, dashArray:[9,11]}).addTo(map);

    tyIcon=L.icon({
        iconUrl: 'images/TYMarker.png',

    });
    
    tdIcon=L.icon({
        iconUrl: 'images/TDMarker.png',
        iconSize:     [9, 15],
        iconAnchor:   [3, 7.5]
    });
    
    fetch('http://typhoon.nmc.cn/weatherservice/typhoon/jsons/list_default').then(response => response.text()).then(data => {
      jsonStart=data.indexOf('{');
      jsonEnd=data.lastIndexOf('}');
      jsonText=data.substr(jsonStart,jsonEnd-jsonStart+1);
      json=JSON.parse(jsonText);
      result=listTyphoons(json.typhoonList);
      let infoWindowDock=document.getElementById('infowindowdock');
      infoWindowDock.innerHTML=result.html;
      infoWindowDock.classList.add('infoWindowDockFirstLevelUp');
      infoWindowDock.style.left='16px'
      infoWindowDock.style.removeProperty('transform');
      tySel=document.getElementById('tysel');
      if(result.active.length>0){
        tySel.selectedIndex=result.active[0];
        boundsCount=0;
        for(let activeIndex of result.active){
          const activeId=activeIndex;
          addTyphoon(json.typhoonList[activeIndex][0],activeIndex,true,()=>{
            boundsCount>0?(bounds=bounds.extend(TCTrackPlotAPI.indicesToTYLayers[activeId].getBounds())):(bounds=TCTrackPlotAPI.indicesToTYLayers[activeId].getBounds())
            if(++boundsCount==result.active.length){
              map.fitBounds(bounds)
            }
          })
        }
      }else{
        addTyphoon(json.typhoonList[0][0],0,false)
        if(weather){map.removeLayer(weather)}
        if(sun){map.removeLayer(sun)}
        if(forecast){map.removeLayer(forecast)}
        if(air){map.removeLayer(air)}
        if(window.satelliteOverlay){map.removeLayer(satelliteOverlay)}
        if(layerPlaceholder){
          map.removeLayer(layerPlaceholder)
          removeRealsFromMap()
          map.off('zoomstart',removeRealsFromMap)
          map.off('zoomend',addRealsToMap)
        }
      }
      TCTrackPlotAPI.indicesToTYLayers={}
      tySel.addEventListener('change', function(){
        const selectedIndex=tySel.selectedIndex;
        if(layerAddToMap=TCTrackPlotAPI.indicesToTYLayers[selectedIndex]){
          TCTrackPlotAPI.hideInactiveAndNotSelectedTCs()
          map.addLayer(layerAddToMap)
          map.fitBounds(layerAddToMap.getBounds())
        }else{
          tyInfo=json.typhoonList[selectedIndex];
          addTyphoon(tyInfo[0],selectedIndex,tyInfo[7]!='stop')
        }
      }, false);

      listPastYears();

      function addTyphoon(id,index,tyIsActive,fitBoundsCallback=undefined){
        fetch(`http://typhoon.nmc.cn/weatherservice/typhoon/jsons/view_${id}`).then(individualResponse => individualResponse.text()).then(tyData => {
          secondJsonStart=tyData.indexOf('{');
          secondJsonEnd=tyData.lastIndexOf('}');
          secondJsonText=tyData.substr(secondJsonStart,secondJsonEnd-secondJsonStart+1);
          tyJson=JSON.parse(secondJsonText);
          tyName=tyJson.typhoon[2];
          tyNum=(tyNum=tyJson.typhoon[3])?.toString().length==4?tyNum:undefined;
          locations=tyJson.typhoon[8];
          lyrTY = TCTrackPlotAPI.startTC(tyNum,tyName);
          lyrTY.active=tyIsActive;
          previousPoint=undefined;
          let locationIndex=0;
          for(let pointData of locations){
            function toTime(s){
             return new Date(Date.parse(`${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}T${s.slice(8,10)}:${s.slice(10,12)}Z`))
            }
            point={time:toTime(pointData[1])}
            if(tyNum){
              point.type=pointData[3]
            }
            point.location=[pointData[5],pointData[4]]
            point.pres=pointData[6]
            point.windMPS=pointData[7]
            if(pointData[11]&&pointData[11]["BABJ"]){
              point.predictions=pointData[11]["BABJ"]
              lastPrediction=point.predictions;
            }
            TCTrackPlotAPI.addPoint(locationIndex,locations.length,previousPoint,point)
            if(locationIndex===locations.length-1){
              point.windArea=pointData[10]
              point.predictions=pointData[11]?pointData[11]["BABJ"]:undefined
              for(let radius of point.windArea){
                L.circle(point.location, {radius: 1000*Math.max(...radius.slice(1,5)),color: windRadiusesToColours[radius[0]]}).addTo(lyrTY);
              }
              lastLoc=point
              predictions=point.predictions??(tyIsActive?lastPrediction:undefined);
              if(predictions){
                for(let predData of predictions){
                  predictionTime=new Date(toTime(predData[1])-(-predData[0]*3600000));
                  if(predictionTime<=point.time){continue}
                  nextLoc={
                    time:new Date(toTime(predData[1])-(-predData[0]*3600000)),
                    location:[predData[3],predData[2]],
                    pres:predData[4],
                    windMPS:predData[5]
                  }
                  if(tyNum||predData[7]!="TD"){
                    nextLoc.type=predData[7]
                  }
                  L.polyline([lastLoc.location,nextLoc.location],{
                    color:levelToColour(windSpeedToLevel(Math.max(lastLoc.windMPS,nextLoc.windMPS))),
                    weight:3.5,dashArray:[0,7]
                  }).addTo(lyrTY);
                  L.marker(nextLoc.location,{icon:nextLoc.type=="TD"||nextLoc.windMPS<=17.1?tdIcon:tyIcon})
                    .bindTooltip(tyInfoPanel(tyName,`＋${predData[0]}小时`,nextLoc,true),{opacity:0.5}).addTo(lyrTY);
                  lastLoc=nextLoc
                }
              }
            }
            previousPoint=point
            locationIndex++
          }
          TCTrackPlotAPI.closeTC(index,tyIsActive,fitBoundsCallback===undefined)
          if(fitBoundsCallback){fitBoundsCallback()}
        });
      }
    });
}
if(location.hash==='#tflj'){openTCTracks()}

<script>
function listTyphoons(typhoonList){
  let tyIndex=0
  const active=[]
  let typhoons=''
  let year=undefined
  typhoonList.sort(function(former,latter){return latter[0]-former[0]})
  let fourDigitNumber
  for(let ty of typhoonList){
    if(!year||!fourDigitNumber){
      let diff
      let tyNumber=ty[3]
      if(tyNumber?.toString().length===4){
        fourDigitNumber=true
        diff=now.getFullYear()%100-tyNumber.substr(0,2)
      }
      if(tyNumber?.toString().length===8){
        diff=now.getFullYear()%100-tyNumber.substr(2,2)
      }
      if(diff!==undefined){
        if(diff<0){diff+=100}
        TCTrackPlotAPI.year=year=now.getFullYear()-diff
      }
    }
    if(ty[7]!='stop'){
      active.push(tyIndex)
    }
    typhoons+=`<option>${ty[2]}　${ty[3]?.toString().length===4?`${ty[3]}　`:''}${ty[7]=='stop'?'已停编':'活动中'}</option>`
    tyIndex++
  }
  return{html:`<select id=tysel>${typhoons}</select>`,active}
}
function tyInfoPanel(num,name,data,prediction=false){
  text=prediction?
    `<tr><td>${num}</td><td>${name}</td></tr>`
    :num?`<tr><td>${num}</td><td>${name}</td></tr>`:`<tr><td colspan=2>${name}</td></tr>`
  for(let key in data){
    if(show=template(key,data[key])){
      text+=show
    }
  }
  return`<table>${text}</table>`
}
translate={
  "TD":'热带低压',"TS":'热带风暴',"STS":'强热带风暴',"TY":'台风',"STY":'强台风',"SUPERTY":'超强台风',
  "1": '热带低压',"2":'热带风暴',"3": '强热带风暴',"4": '台风',"5": '强台风',"6": '超强台风'
}
function template(name,value){
  switch(name){
    case 'time':return`<tr><td colspan=2>${value.toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric'}).replace(' ','')}</td></tr>`
    case 'type':return value=='0'?undefined:value=='9'?'<tr><td colspan=2>温带气旋</td></tr>':`<tr><td>等级</td><td>${translate[value.toUpperCase()]}</td></tr>`
    case 'pres':return`<tr><td>气压</td><td>${value}百帕</td></tr>`
    case 'windMPS':return`<tr><td>风速</td><td>${value}米/秒(${(num=windSpeedToLevel(value))==-1?'':num==99?'17级以上':`${num}级`})</td></tr>`
    default: return undefined
  }
}
function windSpeedToLevel(mps){
  if(mps>=0&&mps<=0.2){
    return 0
  }else if(mps>=0.3&&mps<=1.5){
    return 1
  }else if(mps>=1.6&&mps<=3.3){
    return 2
  }else if(mps>=3.4&&mps<=5.4){
    return 3
  }else if(mps>=5.5&&mps<=7.9){
    return 4
  }else if(mps>=8.0&&mps<=10.7){
    return 5
  }else if(mps>=10.8&&mps<=13.8){
    return 6
  }else if(mps>=13.9&&mps<=17.1){
    return 7
  }else if(mps>=17.2&&mps<=20.7){
    return 8
  }else if(mps>=20.8&&mps<=24.4){
    return 9
  }else if(mps>=24.5&&mps<=28.4){
    return 10
  }else if(mps>=28.5&&mps<=32.6){
    return 11
  }else if(mps>=32.7&&mps<=36.9){
    return 12
  }else if(mps>=37.0&&mps<=41.4){
    return 13
  }else if(mps>=41.5&&mps<=46.1){
    return 14
  }else if(mps>=46.2&&mps<=50.9){
    return 15
  }else if(mps>=51.0&&mps<=56.0){
    return 16
  }else if(mps>=56.1&&mps<=61.2){
    return 17
  }else if(mps>=61.3){
    return 99
  }else{
    return -1
  }
}
function levelToColour(num){
  if(num<=5){
    return'white'
  }else if(num<=7){
    return'lime'
  }else if(num<=9){
    return'#007fff'
  }else if(num<=11){
    return'#ffdf00'
  }else if(num<=13){
    return'#ff6c00'
  }else if(num<=15){
    return'magenta'
  }else if(num<=17){
    return'red'
  }else{
    return'purple'
  }
}
windRadiusesToColours={"30KTS":'white',"50KTS":'red',"64KTS":'maroon'}

<script>
yearsToData={}

  selectHTML+=`<option ${y===TCTrackPlotAPI.year?'selected ':''}value=${y}>${y}</option>`

async function getYear(selection){
  const y=selection.value
  if(selection.options[0].value==TCTrackPlotAPI.year){selection.options.remove(0)}
  while(selection.nextElementSibling!==null){selection.nextElementSibling.remove()}
  if(y<1949){return}
  let t = yearsToData[y]
  if(!t){
    t = yearsToData[y] = await get(`https://tcdata.typhoon.org.cn/data/CMABSTdata/CH${y}BST.txt`)
  }
  if(t.includes('404 Not Found')){
    for(let selectionIndex=0;selectionIndex<selection.options.length;selectionIndex++){if(selection.options[selectionIndex].value==y){selection.options.remove(selectionIndex);break}}
    getYear(selection)
    return
  }
  if(selection.value==y){listPastYearTyphoons(selection,t)}
}
viewingYearTCNumbersToData={}
function listPastYearTyphoons(element,data){
  let tcSelectHTML='<select onchange=drawTC(this)>'
  lines=data.split('\r\n')
  viewingYearTCNumbersToData={}
  for(let l of lines){
        if(l.startsWith('6666')){
            td_no=l.substring(16,20)
            tc_no=l.substring(21,25)
            tc_name=l.substring(30,40).trim()
            if(td_no.trim().length<4||tc_no.trim().length<4){
              let headerData=l.split(' ').filter(item=>item)
              td_no=headerData[3]
              tc_no=headerData[4]
              tc_name=headerData[7]
            }
            tc_no=tc_no==='0000'?`(${parseInt(td_no)})`:tc_no
            if(tc_name.includes('(-)')){
              td_no+=tc_name.substr(tc_name.indexOf('(-)'))
            }
            tcSelectHTML+=`<option value=${td_no}>${tc_no}　${tc_name}</option>`
            viewingYearTCNumbersToData[td_no]={number:tc_no,name:tc_name,data:[]}
        }else if(l.trim()){
            viewingYearTCNumbersToData[td_no].data.push(l)
        }
  }
  tcSelectHTML+='</select>'
  tcSelectHTML+='<input onclick=drawTC(this.previousElementSibling) type=submit value=→>'
  element.parentNode.insertAdjacentHTML('beforeend',tcSelectHTML)
}
function drawTC(selElement){
  if(selElement.nextElementSibling!==null){selElement.nextElementSibling.remove()}
  const combineIndices=`${selElement.previousElementSibling.selectedIndex},${selElement.selectedIndex}`
  let possibleReinstateLayer;
        if(possibleReinstateLayer=TCTrackPlotAPI.indicesToTYLayers[combineIndices]){
          TCTrackPlotAPI.hideInactiveAndNotSelectedTCs()
          map.addLayer(possibleReinstateLayer)
          map.fitBounds(possibleReinstateLayer.getBounds())
        }else{
  const tdNumber=selElement.value
  let tcToDraw=viewingYearTCNumbersToData[tdNumber]
  TCTrackPlotAPI.startTC(tcToDraw.number,tcToDraw.name)
  let individualTCData=tcToDraw.data
            tc_start=0
  let locationIndex=0,old_color
  for(let l of individualTCData){
            function toTime(s){
             return new Date(Date.parse(`${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}T${s.slice(8,10)}:00Z`))
            }
                time=toTime(l.substring(0,10))
                tc_type=l[11]
                lat=l.substring(13,16)
                long=l.substring(17,21)
                pres=l.substring(22,26)
                wind=l.substring(27,34)
                const nowPoint={time,type:tc_type,pres,windMPS:wind,location:[parseFloat(lat)/10.0,parseFloat(long)/10.0]}
                let color
                if(tc_type=='9'){
                    color=makeColour(0,64,128)
                }
                function makeColour(b,g,r){return`rgb(${r},${g},${b})`}
                if(tc_start==0){
                    tc_start=1
                }else{
                    TCTrackPlotAPI.addPoint(locationIndex,individualTCData.length,oldPoint,nowPoint,old_color)
                }
                oldPoint=nowPoint
                old_color=color
                locationIndex++
  }
  TCTrackPlotAPI.closeTC(combineIndices)
        }
}
