<script src=src/geoSvg.js></script>
<script>
offset=offset_Albes
const projCtr=[110,33],缩放比例=1.89,左移=-0.075,上移=0.082
const figureSize=2048
canvas=document.getElementsByTagName('svg')[0]
canvas.setAttribute('height',figureSize)
canvas.setAttribute('width',figureSize)
setTimeout(()=>{
mapOutline='';
var cities,alarmCount=0,dataObject,drawAllAreasAndAlarms
(async()=>{let provincesAndPrefectures={provinces:'',prefectures:''};const provinces=(await(await fetch('json/xzqhsheng.json')).json()).features
  for(let prov of provinces){
                  let g=document.createElement('g');
                  if(prov.geometry.type==='MultiLineString'){drawOutline(prov.geometry.coordinates,'black',g)}
                  else if(prov.geometry.type==='MultiPolygon'){drawShape(prov.geometry.coordinates,'transparent',g,'black')}
                  provincesAndPrefectures.provinces+=g.outerHTML
  }const prefectures=(await(await fetch('json/xzqhshi.json')).json()).features
  for(let pref of prefectures){
                  let g=document.createElement('g');
                  if(pref.geometry.type==='MultiLineString'){drawOutline(pref.geometry.coordinates,'grey',g)}
                  else if(pref.geometry.type==='MultiPolygon'){drawShape(pref.geometry.coordinates,'transparent',g,'grey')}
                  provincesAndPrefectures.prefectures+=g.outerHTML
  }
  mapOutline=provincesAndPrefectures.prefectures+provincesAndPrefectures.provinces
  if(alarmCount===dataObject?.data.length&&cities){drawAllAreasAndAlarms()}
  else{canvas.insertAdjacentHTML('beforeend',provincesAndPrefectures.provinces)}
})()

allAlarmCities={}
const colourToRanking={red:4,orange:3,yellow:2,blue:1,white:0}
get('https://product.weather.com.cn/alarm/grepalarm_cn.php',{"headers": {
                  "Referer": "http://www.weather.com.cn/"
                }}).then(data => {
  //data=JSON.parse(data).contents
  dataObject=JSON.parse(data.substr(data.indexOf('=') + 1,data.length - data.indexOf('=') - 2))
  canvas.parentNode.insertAdjacentHTML('afterbegin',`<div style=position:absolute>当前全国共有${dataObject.count}个预警。</div>`)
  fetch('json/xzqhx.json').then(r=>r.json()).then(j=>{
    cities=j.features
    if(alarmCount===dataObject.data.length&&mapOutline!==''){drawAll()}
  })
  for(let 预警的序号=0;预警的序号<dataObject.data.length;预警的序号++){
   const alarmDefinition=dataObject.data[预警的序号]
   setTimeout(()=>{
    get(`https://product.weather.com.cn/alarm/webdata/${alarmDefinition[1]}`,{"headers": {
                  "Referer": "http://www.weather.com.cn/"
                }}).then(alarmDetailsData => {
      //alarmDetailsData=JSON.parse(alarmDetailsData).contents
      alarmCount++
      let alarmDetailsObject
      try{
        alarmDetailsObject=JSON.parse(alarmDetailsData.substr(alarmDetailsData.indexOf('=') + 1,alarmDetailsData.length - alarmDetailsData.indexOf('=') - 1))
      } catch (error) {
        console.log(error)
        alarmDetailsObject={}
      }
      const colour=alarmDetailsObject.YJYC_EN?.toLowerCase()
      const alarmName=`${alarmDetailsObject.SIGNALTYPE}${alarmDetailsObject.SIGNALLEVEL}预警`
      if(alarmDetailsObject.STATIONNAME){
        if(allAlarmCities[alarmDetailsObject.STATIONNAME]){
          let alarmIndex=0
          for(let alarm of allAlarmCities[alarmDetailsObject.STATIONNAME].alarms){
            if(colourToRanking[alarm.colour]>colourToRanking[colour]){
              alarmIndex++
            }
          }
          allAlarmCities[alarmDetailsObject.STATIONNAME].alarms.splice(alarmIndex,0,{
            alarmName,
            colour,
            time:alarmDetailsObject.ISSUETIME,
            text:alarmDetailsObject.ISSUECONTENT
          })
        }else{
          allAlarmCities[alarmDetailsObject.STATIONNAME]={}
          allAlarmCities[alarmDetailsObject.STATIONNAME].cityId=alarmDetailsObject.identifier.substr(0,6)
          allAlarmCities[alarmDetailsObject.STATIONNAME].alarms=[]
          allAlarmCities[alarmDetailsObject.STATIONNAME].alarms.push({
            alarmName,
            colour,
            time:alarmDetailsObject.ISSUETIME,
            text:alarmDetailsObject.ISSUECONTENT
          })
        }
      }else{console.log('预警区域含多个城市',alarmDetailsObject.EFFECT,alarmDetailsObject.identifier)}
      if(alarmCount===dataObject.data.length&&cities&&mapOutline!==''){drawAll()}
    })
   },1000*parseInt(预警的序号/500))
  }
  let drawAll=drawAllAreasAndAlarms=()=>{
    canvas.innerHTML=''
    for(let city of cities){
        const areaJson=city
                  const g=document.createElement('g');
                  if(areaJson.geometry.type==='MultiLineString'){drawOutline(areaJson.geometry.coordinates,'darkgrey',g)}
                  else if(areaJson.geometry.type==='MultiPolygon'){drawShape(areaJson.geometry.coordinates,'lightgrey',g,'darkgrey')}
                  canvas.insertAdjacentHTML('beforeend',g.outerHTML);
    }
    canvas.insertAdjacentHTML('beforeend',mapOutline);
    const infoPanel=document.createElement('div')
    infoPanel.setAttribute('id','infoPanel')
    infoPanel.setAttribute('style','position:fixed;left:calc(100vw - 155px);bottom:8px;width:128px;max-height:calc(100vh - 25px);overflow:auto;vertical-align:text-top')
    canvas.parentNode.appendChild(infoPanel)
    for(let[alarmCityName,alarmCity] of Object.entries(allAlarmCities)){
      const alarmsOfCity=alarmCity.alarms
      let highestColourLevel=alarmsOfCity[0].colour
      const areaJson=cities.find(c=>c.properties.gb===`156${alarmCity.cityId}`)
      if(!areaJson){console.log('找不到对应的城市',alarmCityName,alarmCity.cityId);continue}
                  const textColours={
                    white:'grey',
                    blue:'darkblue',
                    yellow:'darkgoldenrod',
                    orange:'orangered',
                    red:'darkred'
                  }
                  let description=''
                  for(let alarm of alarmsOfCity){
                    description+=`<tspan dy=1em fill=${textColours[alarm.colour]}>${alarm.alarmName}</tspan>
<tspan dy=1em fill=${textColours[alarm.colour]}>${alarm.time}</tspan>
`
                  }
                  description+=`<tspan dy=1em>${alarmCityName}</tspan>`
                  const title=document.createElement('text');
                  title.setAttribute('fill',textColours[highestColourLevel])
                  title.classList.add('hoverTooltip')
                  title.innerHTML=description;
                  const textLines=title.getElementsByTagName('tspan')
                  textLines[0].setAttribute('dy','0')
                  const g=document.createElement('g');
                  let centrePoint=drawShape(areaJson.geometry.coordinates,highestColourLevel==='blue'?'royalblue':highestColourLevel,g,undefined);
      g.setAttribute('onmouseover',`document.getElementById('infoPanel').innerHTML=\`${alarmsOfCity.map(alarm=>`<span style=color:${textColours[alarm.colour]}>${alarm.text}</span>`).join('<br>')}\`;document.getElementById('infoPanel').style.color='${textColours[highestColourLevel]}'`)
                  g.setAttribute('onmouseout',`document.getElementById('infoPanel').innerHTML=''`)
                  g.classList.add('alarmArea')
                  g.appendChild(title)
                  title.setAttribute('x',centrePoint.x)
                  title.setAttribute('y',centrePoint.y)
                  for(let lineIndex=0;lineIndex<textLines.length;lineIndex++){
                    textLines[lineIndex].setAttribute('x',centrePoint.x)
                  }
                  canvas.insertAdjacentHTML('beforeend',g.outerHTML);
    }
  }
})
},1)
</script>
