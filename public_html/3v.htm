const 创建语句=地块号=>{
  let 语句=(`CREATE VIEW ${地块号} AS\n`)
  const 行=地块号.charCodeAt(0)-65,列=+地块号.substr(1)
  const 结束经度=-180+6*列
  const 起始经度=结束经度-6
  const 起始纬度=行*4
  const 结束纬度=起始纬度+4
  const 全包含=分块[地块号][1] instanceof Array?分块[地块号][1]:[]
  const 部分包含=分块[地块号][0] instanceof Array?分块[地块号][0]:分块[地块号]
  for(let 次序=0;次序<全包含.length;次序++){
    语句+=(`SELECT 地市区县,乡镇街道,经度,纬度,等级,城郊性质 FROM ${全包含[次序]}\n`)
    语句+=('UNION\n')
  }
  for(let 次序=0;次序<部分包含.length;){
    语句+=(`SELECT 地市区县,乡镇街道,经度,纬度,等级,城郊性质 FROM ${部分包含[次序]} WHERE 经度>${起始经度} AND 经度<=${结束经度} AND 纬度>${起始纬度} AND 纬度<=${结束纬度}\n`)
    if(++次序<部分包含.length){语句+=('UNION\n')}
  }
  语句+=(';\n<br>')
  return 语句
}
async function 取得四至范围内地点(起始经度,起始纬度,终止经度,终止纬度){
  const 起始列数=Math.ceil((起始经度+180)/6.0)
  const 起始行数=Math.ceil(起始纬度/4.0)-1
  const 终止列数=Math.ceil((终止经度+180)/6.0)
  const 终止行数=Math.ceil(终止纬度/4.0)-1
  let 结果=[]
  for(let 行序号=起始行数;行序号<=终止行数;行序号++){
    for(let 列号=起始列数;列号<=终止列数;列号++){
      const 行号=String.fromCharCode(行序号+'A'.charCodeAt(0))
      const 地块号=行号+列号
      if(地块号 in 分块&&分块[地块号].length>0){
        结果=结果.concat(await SQL(`SELECT*FROM ${地块号} WHERE 经度>${起始经度} AND 经度<${终止经度} AND 纬度>${起始纬度} AND 纬度<${终止纬度}`))
      }
    }
  }
  return 结果.filter(地点=>(地点[4]==0||地点[4]==1)&&地点[5]==0)
}

function 转换直角坐标(纬度,经度,高度=1){
  纬度*=Math.PI/180
  经度*=Math.PI/180
  return [(radius+高度)*Math.cos(纬度)*Math.cos(经度),(radius+高度)*Math.cos(纬度)*Math.sin(经度),(radius+高度)*Math.sin(纬度)]
}

      空间位置[1]=Math.round(空间位置[1])

function CalcMoonECLatitudePeriodicTbl( D,  M,  Mp,  F,  E)
{
  var Eb = 0.0 ;

 for( i = 0; i < Latitude.length; i++)
 {
  let sita = Latitude[i][0] * D + Latitude[i][1] * M + Latitude[i][2] * Mp + Latitude[i][3] * F;
 sita *= Math.PI/180.0;
 Eb += (Latitude[i][4] * Math.sin(sita) * Math.pow(E, Math.abs(Latitude[i][1])));
 }

 return Eb;
}
function CalcMoonLatitudePerturbation( dt,  Lp, Mp,  F)
{
  const T = dt; /*T是从J2000起算的儒略世纪数*/
  let A1 = 119.75 + 131.849 * T;
  let A2 = 53.09 + 479264.290 * T;
  let A3 = 313.45 + 481266.484*T;  //const A3=ELP82.constrain(313.45 + 481266.484*T)*toRad;

 A1 %= 360;
 A2 %= 360;
 A3 %= 360;

let  result = -2235.0*Math.sin(Lp*Math.PI/180.0);
  result += 382.0 * Math.sin(A3* Math.PI/180.0);
 result += 175.0 * Math.sin((A1 - F)* Math.PI/180.0);
 result += 175.0 * Math.sin((A1 + F)* Math.PI/180.0);
 result += 127 * Math.sin((Lp-Mp)* Math.PI/180.0);

function CalcEarthObliquityNutation( dt) 
{ 
 const T = dt * 10; /*T是从J2000起算的儒略世纪数*/ 
 const [D,M,Mp,F,Omega]=GetEarthNutationParameter(dt); 
 
var resulte = 0.0 ; 

// -------------------------
// Define working variables.

   var /*T,*/ T2, T3, DegToRad;
   var w, w1, w2, w3, w4, w5;

// ---------------------------------
// Compute (T) in Julian centuries
// from J2000.0 and powers of (T).

   //T = (JDTT - 2451545.0) / 36525.0;
   T2 = T * T;
   T3 = T * T2;

// ------------------------------------------------
// Define conversion factor for degrees to radians.
// Multiply degrees by this factor to get radians.

   DegToRad = 3.1415926535897932 / 180;

// -----------------------------------------------
// Compute mean elongation of the moon in radians.

   w1 = DegToRad*D;

// -------------------------------------------
// Compute mean anomaly of the sun in radians.

   w2 = DegToRad*M;

// --------------------------------------------
// Compute mean anomaly of the moon in radians.

   w3 = DegToRad*Mp;

// -----------------------------------------------
// Compute moon's argument of latitude in radians.

   w4 = DegToRad*F;

// ------------------------------------------------------
// Compute longitude of moon's ascending node in radians.

   w5 = DegToRad*Omega;

// ---------------------------------------------
// Compute the nutation in obliquity in terms of
// arc seconds * 10000

   w  = Math.cos(w5)*(92025 + 8.9*T);

   w += Math.cos(2*(w4 - w1 + w5))*(5736 - 3.1*T);
   w += Math.cos(2*(w4 + w5))*(977 - 0.5*T);
   w += Math.cos(2*w5)*(0.5*T - 895);
   w += Math.cos(w2)*(54 - 0.1*T);
   w -= 7*Math.cos(w3);
   w += Math.cos(w2 + 2*(w4 - w1 + w5))*(224 - 0.6*T);
   w += 200*Math.cos(2*w4 + w5);
   w += Math.cos(w3 + 2*(w4 + w5))*(129 - 0.1*T);
   w += Math.cos(2*(w4 - w1 + w5) - w2)*(0.3*T - 95);
   w -= 70*Math.cos(2*(w4 - w1) + w5);
   w -= 53*Math.cos(2*(w4 + w5) - w3);
   w -= 33*Math.cos(w3 + w5);
   w += 26*Math.cos(2*(w1 + w4 + w5) - w3);
   w += 32*Math.cos(w5 - w3);
   w += 27*Math.cos(w3 + 2*w4 + w5);
   w -= 24*Math.cos(2*(w4 - w3) + w5);
   w += 16*Math.cos(2*(w1 + w4 + w5));
   w += 13*Math.cos(2*(w3 + w4 + w5));
   w -= 12*Math.cos(w3 + 2*(w4 - w1 + w5));
   w -= 10*Math.cos(2*w4 + w5 - w3);
   w -= 8*Math.cos(2*w1 - w3 + w5);
   w += 7*Math.cos(2*(w2 - w1 + w4 + w5));
   w += 9*Math.cos(w2 + w5);
   w += 7*Math.cos(w3 + w5 - 2*w1);
   w += 6*Math.cos(w5 - w2);
   w += 5*Math.cos(2*(w1 + w4) - w3 + w5);
   w += 3*Math.cos(w3 + 2*(w4 + w1 + w5));
   w -= 3*Math.cos(w2 + 2*(w4 + w5));
   w += 3*Math.cos(2*(w4 + w5) - w2);
   w += 3*Math.cos(2*(w1 + w4) + w5);
   w -= 3*Math.cos(2*(w3 + w4 + w5 - w1));
   w -= 3*Math.cos(w3 + 2*(w4 - w1) + w5);
   w += 3*Math.cos(2*(w1 - w3) + w5);
   w += 3*Math.cos(2*w1 + w5);
   w += 3*Math.cos(2*(w4 - w1) + w5 - w2);
   w += 3*Math.cos(w5 - 2*w1);
   w += 3*Math.cos(2*(w3 + w4) + w5);

// -----------------------------------
// Done.  Return nutation in obliquity
// expressed in decimal degrees.

   //return w / 36000000.0;


/*先乘以章动表的系数 0.001，然后换算成度的单位*/ 
return resulte=w * 0.0001 / 3600.0; 
}

    let jde=getJD(时刻)
    var dt = (jde - 2451545) / 365250.0; /*儒略千年数*/



    // 计算太阳的地心黄经

    var longitude = CalcSunEclipticLongitudeEC(dt);



    // 计算太阳的地心黄纬

    var latitude = CalcSunEclipticLatitudeEC(dt)// * 3600.0;



    // 修正精度

    longitude += AdjustSunEclipticLongitudeEC(dt, longitude, latitude);



    // 修正天体章动

    longitude += (章动黄经分量=CalcEarthLongitudeNutation(dt));


    var 日地距离天文单位=CalcSunEarthRadius(dt)
    // 修正光行差
    
    /*太阳地心黄经光行差修正项是: -20".4898/R*/

    longitude -= (20.4898 / 日地距离天文单位) / (3600.0);



    日地距离=日地距离天文单位*天文单位
let 太阳位置赤道坐标=转成赤道经纬度(longitude,latitude,黄赤交角)
太阳位置赤道坐标[0]+=-(太阳黄经=longitude)+太阳.经度
return 转换直角坐标(太阳位置赤道坐标[1],太阳位置赤道坐标[0],日地距离-radius)
}
function 计算月球位置(时刻){
 let dbJD=getJD(时刻)
 var dt = (dbJD - 2451545) / 36525.0; /*儒略世纪数*/

 const [Lp,D,M,Mp,F,E]=GetMoonEclipticParameter(dt);

 /*计算月球地心黄经周期项*/
 var EI = CalcMoonECLongitudePeriodicTbl(D, M, Mp, F, E);

 /*修正金星,木星以及地球扁率摄动*/
 EI += CalcMoonLongitudePerturbation(dt, Lp, F);

 /*计算月球地心黄经*/
 var longitude = Lp + EI / 1000000.0;

 /*计算天体章动干扰*/
 longitude += 章动黄经分量;

 longitude = (val360=longitude%360)+(val360>=0?0:360);
 

 /*计算月球地心黄纬周期项*/
 var Eb = CalcMoonECLatitudePeriodicTbl(D, M, Mp, F, E);

 /*修正金星,木星以及地球扁率摄动*/
 Eb += CalcMoonLatitudePerturbation(dt, Lp, Mp, F);

 /*计算月球地心黄纬*/
 var latitude = Eb / 1000000.0;

 var 地月距离=385000.56+CalcMoonECRadiusPeriodicTbl(D, M, Mp, F, E)/1000;
let 月球位置赤道坐标=转成赤道经纬度(longitude,latitude,黄赤交角)
月球位置赤道坐标[0]+=-太阳黄经+太阳.经度
return 转换直角坐标(月球位置赤道坐标[1],月球位置赤道坐标[0],地月距离-radius)
}

Math.radians=度=>度/180*Math.PI
function latlong_distance(lat_long_1, lat_long_2){
    var lat1 = Math.radians(lat_long_1[0])
    var lon1 = Math.radians(lat_long_1[1])
    var lat2 = Math.radians(lat_long_2[0])
    var lon2 = Math.radians(lat_long_2[1])

    var dlon = lon2 - lon1
    var dlat = lat2 - lat1

    var a = Math.pow(Math.sin(dlat / 2),2) + Math.cos(lat1) * Math.cos(lat2) * Math.pow(Math.sin(dlon / 2),2)
    var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a))

    var distance = radius * c
    return distance * 1000
}

function 简化名字(全名){
        let 专用名字=全名
        const 需要叫全名=['临夏县','和田县','伊宁县','嘉义县','新竹县','淮安区','黄山区','东营区','荆州区','广安区','白银区','克拉玛依区',

          if(!需要叫全名.includes(专用名字)&&!(专用名字.length>3&&(专用名字.endsWith('矿区')||专用名字.endsWith('新区')))&&!专用名字.split('').every(字=>'东西南北中区'.includes(字))&&专用名字!=='神农架林区'&&!专用名字.endsWith('特区')&&!专用名字.endsWith('保护区')&&!专用名字.endsWith('马场')){
            if(专用名字.length<=3&&!专用名字.endsWith('旗')){专用名字=专用名字.substr(0,2)}
            else{
              if(专用名字==='东乡族自治县'){
                专用名字='东乡';
              }else if(专用名字==='内蒙古自治区'){
                专用名字='内蒙古';
              }else if(专用名字.startsWith('鄂温克')){
                专用名字='鄂温克旗';
              }else if(专用名字.startsWith('鄂伦春')){
                专用名字='鄂伦春旗';
              }else if(专用名字==='达尔罕茂明安联合旗'){
                专用名字='达尔罕茂明安旗';
              }else if(专用名字.startsWith('喀喇沁左翼')){
                专用名字='喀左';
              }else{
                专用名字=shortName(专用名字);
              }
              function shortName(longName){
                if(longName.includes('自治')||longName.startsWith('梅里斯')||longName.startsWith('管城')||longName.startsWith('顺河')||longName.startsWith('瀍河')){
                  longName=longName.replace('满族','').replace('蒙古','').replace('回族','')
                      .replace('达斡尔族','').replace('鄂温克族','').replace('鄂伦春族','').replace('朝鲜族','').replace('赫哲族','')

                      .replace('羌族','').replace('藏族','').replace('彝族','').replace('布依族','').replace('仡佬族','').replace('水族','')
                      .replace('白族','').replace('纳西族','').replace('傈僳族','').replace('普米族','').replace('独龙族','').replace('怒族','')

                      .replace('拉祜族','').replace('德昂族','').replace('基诺族','').replace('哈尼族','').replace('门巴族','').replace('珞巴族','')
                      .replace('保安族','').replace('东乡族','').replace('撒拉族','').replace('裕固族','').replace('土族','')
                      .replace('维吾尔','').replace('哈萨克','').replace('柯尔克孜','').replace('锡伯','').replace('塔吉克','')
                      .replace('乌孜别克','').replace('俄罗斯','').replace('塔塔尔','').replace('高山族','').replace('各族','').replaceAll('族','').replace('自治','')
                }
                if(longName.endsWith('旗')){
                  let 左=longName.indexOf('左'),右=longName.indexOf('右'),前=longName.indexOf('前'),中=longName.indexOf('中'),后=longName.indexOf('后')
                  let 旗方位名=''
                  if(左!==-1){旗方位名+='左'}
                  if(右!==-1){旗方位名+='右'}
                  if(前!==-1){旗方位名+='前'}
                  if(中!==-1){旗方位名+='中'}
                  if(后!==-1){旗方位名+='后'}
                  return 旗方位名.length>1?longName.substr(0,1)+旗方位名+'旗':longName
                }else{
                  if(longName==='阜新县'||longName==='本溪县'){return longName}
                  const EndNames=['特别行政区','地区','盟','州','县','区','市','镇','省','行政委员会']
                  for(let word of EndNames){
                    if(longName.endsWith(word)){
                      return longName.substr(0,longName.lastIndexOf(word))
                    }
                  }
                }
              }
            }
          }
        return 专用名字
}

  视野包含纬度数/=Math.PI/180
  视野包含经度数/=Math.PI/180
  return [Math.max(纬度-视野包含纬度数/2,-90),经度-视野包含经度数/2+(经度-视野包含经度数/2<-180?360:0),Math.min(纬度+视野包含纬度数/2,90),经度+视野包含经度数/2-(经度+视野包含经度数/2>180?360:0)]
}

function 记录低级别地点(名称,经度,纬度,加入的组,大小=false,上下=false,颜色=undefined){

				}else{

				}

				加入的组?.add( earthLabel );

async function 递归分割查询(初始范围){
  const 初始查询=await(await fetch(`http://api.tianditu.gov.cn/v2/search?postStr={"mapBound":"${初始范围}","queryType":13,"start":0,"count":100,"specify":"156000000","dataTypes":"260109"}&type=query&tk=${调用密匙}`)).json()
  const 所有结果=[]
  const 经向范围=初始范围[3]-初始范围[1]
  const 中心纬度=(初始范围[3]+初始范围[1])/2
  const 纬向范围=(初始范围[2]-初始范围[0])*Math.cos(中心纬度)
  if(!初始查询.pois){return 所有结果}
  if(初始查询.count>175){
    所有结果.push.apply(所有结果,await 递归分割查询([初始范围[0],初始范围[1],(初始范围[0]+初始范围[2])/2,(初始范围[1]+初始范围[3])/2]))
    所有结果.push.apply(所有结果,await 递归分割查询([初始范围[0],(初始范围[1]+初始范围[3])/2,(初始范围[0]+初始范围[2])/2,初始范围[3]]))
    所有结果.push.apply(所有结果,await 递归分割查询([(初始范围[0]+初始范围[2])/2,初始范围[1],初始范围[2],(初始范围[1]+初始范围[3])/2]))
    所有结果.push.apply(所有结果,await 递归分割查询([(初始范围[0]+初始范围[2])/2,(初始范围[1]+初始范围[3])/2,初始范围[2],初始范围[3]]))
  }else if(初始查询.count>100){
   if(经向范围>纬向范围){
    所有结果.push.apply(所有结果,await 递归分割查询([初始范围[0],初始范围[1],初始范围[2],中心纬度]))
    所有结果.push.apply(所有结果,await 递归分割查询([初始范围[0],中心纬度,初始范围[2],初始范围[3]]))
   }else{
    所有结果.push.apply(所有结果,await 递归分割查询([初始范围[0],初始范围[1],(初始范围[0]+初始范围[2])/2,初始范围[3]]))
    所有结果.push.apply(所有结果,await 递归分割查询([(初始范围[0]+初始范围[2])/2,初始范围[1],初始范围[2],初始范围[3]]))
   }
  }{
    所有结果.push.apply(所有结果,初始查询.pois)
  }
  return 所有结果
}

function 有重合(四至范围前者,四至范围后者){
  return 四至范围前者[2]>四至范围后者[0]&&四至范围前者[0]<四至范围后者[2]&&四至范围前者[3]>四至范围后者[1]&&四至范围前者[1]<四至范围后者[3]
}
