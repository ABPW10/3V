        function printsingle(aex, name, j)//显示单一条进球信息
        {
            let ActualTime;//time的表示，可以是一个数字（整数），或补时“45+3”形式（字符串）
            let time;//减掉补时以后在某个半场的真实时间。因为补时的存在，46分钟实际上在45+3分钟之后，输出需要按时间顺序，因此46=45+3+1=49分钟。每半场补时时间清零（假设补时时长等于半场双方总进球数），如果下半场某个时刻减去上半场的补时时长，才是下半场的真实时间。
            if (aex[j] > 45 + AddTime1Hf)//下半场
            
                     
            
                if ((time = aex[j] - AddTime1Hf) > 90 + AddTime2Hf)//加时赛上半场
                
                    
                    if ((time -= AddTime2Hf) > 105 + AddTimeE1Hf)//加时赛下半场
                     
                        if ((time -= AddTimeE1Hf) > 120 + AddTimeE2Hf)
                            ActualTime = 0;//这个值没有意义
                        else
                        {
                            
                            if (time > 120) ActualTime = "120+" + Math.ceil(time - 120);//真实时间减掉总时间，得到补时的分钟数
                            else ActualTime = Math.ceil(time);//不是补时，就直接显示时间，Ceiling将1.5分钟显示为2分钟
                        }
                    else
                    {
                        if (time > 105) ActualTime = "105+" + Math.ceil(time - 105);
                        else ActualTime = Math.ceil(time);
                    }
                else
                {
                    
                    if (time > 90)
                        ActualTime = "90+" + Math.ceil(time - 90);
                    else ActualTime = Math.ceil(time);
                }
            else if (aex[j] > 45)
                ActualTime = "45+" + Math.ceil(aex[j] - 45);
            else ActualTime = (Math.ceil(aex[j]));
            if (!name[j])
            {
                richTextBox1.AppendText(`第${ActualTime}分钟，${groupBox1.Text()}进球！`);//name数组判断是哪一方的进球
                if (!finalEnabled) richTextBox1.AppendText(`(${k1 + 1}－${k2})`);
                richTextBox1.AppendText("\r\n");
            }
            else
            {
                richTextBox1.AppendText(`第${ActualTime}分钟，${groupBox2.Text()}进球！`);
                if (!finalEnabled) richTextBox1.AppendText(`(${k1}－${k2 + 1})`);
                richTextBox1.AppendText("\r\n");
            }
                return 0;
        }

        function UpdateScoreboard(aex, name, j)//更新记分牌，参数与printsingle相同
        {
            if (!name[j]) textBox3.Text = (++k1).toString() ;//某队进球加1
            else textBox4.Text = (++k2).toString();
            let ActualTime= aex[j] > 45 + AddTime1Hf ? aex[j] > 90 + AddTime1Hf + AddTime2Hf ? aex[j] > 105 + AddTime1Hf + AddTime2Hf + AddTimeE1Hf ? aex[j] > 120 + AddTime1Hf + AddTime2Hf + AddTimeE1Hf + AddTimeE2Hf ? 0 : aex[j] -AddTime1Hf-AddTime2Hf- AddTimeE1Hf : aex[j] - AddTime1Hf - AddTime2Hf : aex[j] - AddTime1Hf : aex[j];//与printsingle中的解释同理，减掉补时时间才是某个半场的真实时间。
            let zs = Math.trunc(ActualTime);//分钟数，取ActualTime的整数部分
            let xs = (Math.ceil((aex[j] - Math.trunc(aex[j])) * 60));//秒数
            if (xs == 60) { xs = 0;zs++; }//秒=60，分钟增加1
            textBox5.Text=(zs<10?'0'+zs.toString():zs.toString())+':'+(xs<10?'0'+xs.toString(): xs.toString());//如果分钟或秒为个位数，在前面加0
            return 0;
        }
        let HalfTime = false;//表示有没有经过中场休息
        function GotoHalfTime(j)//将记分板显示为中场休息状态，并重置当前比赛时间
        {
            HalfTime = true;
            currentTime = j?45.0:105.0;
            textBox5.Text = j?"中场休息":"加时赛中段换边";
            richTextBox1.ScrollToCaret();
        }
        function printproc(aex,name, prmr, step)//调用printsingle显示进球信息，或在没有进球发生时改变当前显示的时间。aex、name是指示包含所有进球时间和进球队伍的数组，prmr指示常规时间或加时，step指示是否实时显示
        {
            if (prmr)
            {
                if (step)
                {
                    if (!HalfTime)//如果未达中场休息，而且当前上半场已经结束，则进入中场休息
                        if (i == AddTime1Hf && currentTime >= 45.0 )
                            GotoHalfTime(true);
                        else
                    if (aex[i] > 0 && aex[i] < currentTime + 15.0)//如果currentTime往后的15分钟内有进球，显示下一个进球并更新记分牌；currentTime不随进球改变，只能是15的倍数。
                        {
                                printsingle(aex, name, i);
                                UpdateScoreboard(aex, name, i);
                                i++;//输出控制变量自增1
                    }
                    else//如果currentTime往后的15分钟内没有进球，时间前进15分钟并更新记分板上的时间
                    {
                        currentTime += 15.0;
                            if (i == AddTime1Hf && currentTime >= 45.0+AddTime1Hf)//上半场结束了，进入中场休息
                                GotoHalfTime(true);
                            else
                                textBox5.Text = currentTime.toString()+":00";
                        richTextBox1.ScrollToCaret();
                    }
                    else//下半场
                    {
                        if (aex[i] > 0 && aex[i]-AddTime1Hf < currentTime + 15.0)//如果currentTime往后的15分钟内有进球，显示下一个进球并更新记分牌；currentTime不随进球改变，只能是15的倍数；数组中存储的时间减去上半场的补时时长，才是下半场的真实时间
                        {
                            printsingle(aex, name, i);
                            UpdateScoreboard(aex, name, i);
                            i++;
                        }
                        else//如果currentTime往后的15分钟内没有进球，时间前进15分钟并更新记分板上的时间
                        {
                            currentTime += 15.0;
                            textBox5.Text = currentTime.toString() + ":00";
                            richTextBox1.ScrollToCaret();
                        }
                    }
                }
                else
                    for (; aex[i] > 0; i++)//从下一个进球开始，输出直到比赛（常规时间）结束的所有信息。
                    {
                        if (aex[i] < 90+AddTime1Hf+AddTime2Hf)
                            printsingle(aex, name, i);
                                            }
            }
            else
            {
                if (step)
                {
                    if(!HalfTime)
                        if (i == AddTime1Hf + AddTime2Hf + AddTimeE1Hf && currentTime >= 105.0)

                            GotoHalfTime(false);

                        else
                    if (aex[i] > 0 && aex[i] >= 90+AddTime1Hf+AddTime2Hf && aex[i]-AddTime1Hf-AddTime2Hf < currentTime + 15.0)
                    {
                        printsingle(aex, name, i);
                        UpdateScoreboard(aex, name, i);
                        i++;
                    }
                    else
                    {
                        currentTime += 15.0;
                            if ( i == AddTime1Hf + AddTime2Hf + AddTimeE1Hf && currentTime >= 105.0 + AddTimeE1Hf)

                                GotoHalfTime(false);

                            else
                                textBox5.Text = currentTime.toString() + ":00";
                        richTextBox1.ScrollToCaret();
                    }
                    else
                    {
                        if (aex[i] > 0 && aex[i]-AddTime1Hf-AddTime2Hf-AddTimeE1Hf < currentTime + 15.0)
                        {
                            printsingle(aex, name, i);
                            UpdateScoreboard(aex, name, i);
                            i++;
                        }
                        else
                        {
                            currentTime += 15.0;
                                textBox5.Text = currentTime.toString() + ":00";
                            richTextBox1.ScrollToCaret();
                        }
                    }
                }
                else
                    for (; aex[i] > 0; i++)
                    {
                        if (aex[i] >= 90 + AddTime1Hf+AddTime2Hf)
                            printsingle(aex, name, i);
                    }
            }
            return 0;
        }
        function Join(arr1, arr2, name)//将两个数组合并成一个数组，并标记是哪一方的进球；将数组2直接插在数组1之后，之后再调用sort()排序；返回值是两个数组的数据总数
        {
            let i, j;
            for (i = 0; arr1[i] > 0; i++)
                name[i] = false;//name[i] = false表示是甲方进球
            j = i;
            for (i = 0; arr2[i] > 0; i++)
            {
                arr1[j + i] = arr2[i];
                name[j + i] = true;//name[j+i] = true表示是乙方进球
            }
            return j + i;
        }

		function sort(arr, n, name)//给数组排序，因为所排数组本来是部分有序的，可以考虑优化
        {
            let i, j;
            let k;
            let t;
            for (i = 0; i < n - 1; i++)
                for (j = 0; j < n - i - 1; j++)
                    if (arr[j] > arr[j + 1])//arr和name都要交换位置
                    {
                        t = arr[j];
                        arr[j] = arr[j + 1];
                        arr[j + 1] = t;
                        k = name[j];
                        name[j] = name[j + 1];
                        name[j + 1] = k;
                    }
            return 0;
        }
        function AddTime(arr,n)//找出上、下半场，以及加时赛的上、下半场各出现多少粒进球，设定每个半场的补时时间等于该半场的进球总数，并对原始数据进行调整，在每个进球之后插入1分钟的间隔，这些间隔最后作为补时时长。
        {
            AddTime1Hf = AddTime2Hf = AddTimeE1Hf = AddTimeE2Hf = 0;
            
            let i;
            for (i = 0; i < n; i++)
            {
                if (arr[i]>0&&arr[i] <= 45.0)
                {
                    AddTime1Hf ++;
                }
                else if (arr[i] > 45.0 && arr[i] <= 90.0)
                {
                    AddTime2Hf ++;
                }
                else if (arr[i] > 90.0 && arr[i] <= 105.0)
                {
                    AddTimeE1Hf ++;
                }
                else if (arr[i] > 105.0 && arr[i] <= 120.0)
                {
                    AddTimeE2Hf++;
                }
                arr[i] += i;
            }
        }

        {
            let i;
            let k;
            k = 0;//生成甲队的进球，初始时间为0
            for (i = 0; k < 90; i++)//当进球时间>90，已经是加时赛中的进球，暂停

            for (; k < 120; i++)//继续模拟，直到进球时间>120；数组aex从第一项开始，大于0的项为进球时间，索引大于或等于进球数的项全为0

          set:function(val){fm2.getElementsByTagName('label')[0].nextSibling.nodeValue=val},
        })
        const textGetterSetter={
          get:function(){return this.innerHTML},
          set:function(val){this.innerHTML=val}
        }
        Object.defineProperty(this.label1,'Text',textGetterSetter)
        Object.defineProperty(this.label2,'Text',textGetterSetter)
        Object.defineProperty(this.button1,'Text',textGetterSetter)
        Object.defineProperty(this.label13,'Text',textGetterSetter)
        Object.defineProperty(this.label14,'Text',textGetterSetter)
        /*InitializeComponent();
        originalLoc = label2.Right;//记录初始位置
        originalLoc2 = label14.Right;*/
        const a0 = 主队内容.lastElementChild.children//{ label3, label4, label5, label6, label7 };//初始化视图中的“点”数组，动态数组只能在初始化时赋值
        const b0 = 客队内容.lastElementChild.children//{ label12, label11, label10, label9, label8 };
        this.a = a0;//只能通过先给a0赋值再传到a的方式来获得控件数组
        this.b = b0;
        this.label1.Text = fm1.groupBox1.Text();//从原窗口取得两队队名
        this.label2.Text = fm1.groupBox2.Text();
        this.Text += "：" + this.label1.Text + "　－　" + this.label2.Text;
        this.rad = r;//获得原窗口的随机数生成类
        //Th值计算，Th不能太接近1或0，否则会出现死循环；所以用分段线性映射+指数函数的方式
        //正常情况下，点球大战中的罚进概率在0.7到0.8之间
        if (e1 - e2 < 64) this.aTh = 0.7173913 + 0.00435 * parseInt(e1 - e2);
        else this.aTh = 1 - 2.25e26 * Math.exp(parseInt(e2 - e1)*Math.log(2.811));
        if (f1 - f2 < 64) this.bTh = 0.7173913 + 0.00435 * parseInt(f1 - f2);
        else this.bTh = 1 - 2.25e26 * Math.exp(parseInt(f2 - f1) * Math.log(2.811));
        this.pendingRefresh = false;//初始化所有布尔变量和整数型变量
        if (this.rad.NextDouble() < 0.5) { this.first = true; AddMark(this.label1,this); }//随机决定哪一方先罚点球，first=true甲方先罚，first=false乙方先罚
        else { this.first = false; AddMark(this.label2,this); }
        this.originalFirst = this.first;
        this.round = 0;
        this.aScore = this.bScore = 0;
        this.gameEnd = false;
        this.gameStared = false;
        this.ShowDialog=function(){
          document.getElementById('Form2').style.display='block'
          return new Promise(等待点球大战结束)
        }
    }

    function button1_ClickFm2(e)
    {
        if (!fm2.gameStared)
        {
            fm2.gameStared = true;
            fm2.button1.Text = "继续";
        }
        if(fm2.pendingRefresh)//如果上一轮是5的倍数，需要重置，把所有的“点”恢复成灰色
        {
            for (let i of fm2.a)
                i.innerHTML = '⚪';
            for (let i of fm2.b)
                i.innerHTML = '⚪';
            fm2.pendingRefresh = false;//重设pendingRefresh变量
        }

        if (fm2.first)//甲方罚
        {
            if (GetRandomDouble() > fm2.aTh)//没进
            {
                fm2.a[fm2.round % 5].innerHTML = '🔴';
                if (fm2.round < 5 &&  5 - fm2.round - 1 < fm2.bScore - fm2.aScore) { EndGame(); return; }//第5轮之前，我方剩余轮数（轮数从0开始，我方剩余的轮数可证明是5-round-1）已经小于对方领先我方的分差，则对方获胜
            }
            else//进了
            {
                fm2.a[fm2.round % 5].innerHTML = '🟢';
                fm2.aScore++;
                fm2.label13.Text = fm2.aScore.toString();
                if (fm2.round < 5 && 5 - fm2.round - (fm2.first == fm2.originalFirst ? 0 : 1) < fm2.aScore - fm2.bScore) { EndGame(); return; }//第5轮之前，对方剩余轮数已经小于我方领先对方的分差，则我方获胜！如果我方是先罚一方，对方剩余轮数还有5-round，如果我方是后罚，对方剩余轮数是5-round-1
            }
            
            fm2.first = !fm2.first;//改变罚球方
        }
        else//乙方罚
        {
            if (GetRandomDouble() > fm2.bTh) { 
                fm2.b[fm2.round % 5].innerHTML = '🔴';
                if (fm2.round < 5 && 5 - fm2.round - 1 < fm2.aScore - fm2.bScore) { EndGame(); return; }
            }
            else
            {
                fm2.b[fm2.round % 5].innerHTML = '🟢';
                fm2.bScore++;
                fm2.label14.Text = fm2.bScore.toString();
                if (fm2.round < 5 && 5 - fm2.round - (fm2.first == fm2.originalFirst ? 0 : 1) < fm2.bScore - fm2.aScore) { EndGame(); return; }
            }

            fm2.first = !fm2.first;//改变罚球方
        }
        if (fm2.first) { AddMark(fm2.label1); RemMark(fm2.label2); } else { AddMark(fm2.label2); RemMark(fm2.label1); }
        if (fm2.first == fm2.originalFirst)
        {
            fm2.round++;//如果罚球方回到了初始先罚的一方，意味着轮数加1
            if (fm2.round >= 5 && fm2.aScore != fm2.bScore) { EndGame();return; }//第5轮往后是一轮定胜负，与第5轮合写条件为aScore != bScore
            if (fm2.round % 5 == 0) fm2.pendingRefresh = true;//如果满5的倍数就将所有的“点”重置为灰色（在下轮罚球开始前重置，因为要使当前的罚球结果可见一段时间）
        }
    }
    function EndGame()
    {
        显示获胜方()//比赛结束，禁用并隐藏按钮
        //fm2.button1.disabled = true;fm2.button1.Hide();
        //fm2.button2.disabled = true;fm2.button2.Hide();
        RemMark(fm2.label1);
        RemMark(fm2.label2);
        //fm2.label16.Show();
        fm2.gameEnd = true;
    }
    function AddMark(l,fm2=window.fm2)
    {
        if (l===fm2.label1)
        {
            l.Text += '⚽'; return true;
        }
        else if (l===fm2.label2) { l.Text = '⚽' + l.Text; return true; }
        else return false;
    }
    function RemMark(l,fm2=window.fm2)
    {
        let lTxt = l.Text;
        let ltLen = lTxt.length;

        if (l===fm2.label1)
        {
            if (lTxt[ltLen - 1]==='⚽') { l.Text = lTxt.substring(0, ltLen - 1); return true; }
            return false;
        }
        else if (l===fm2.label2)
        {
            if (lTxt[0]==='⚽') { l.Text = lTxt.substring(1, ltLen); return true; }
            return false;
        }
        else return false;
    }
    const 等待点球大战结束=(res,rej)=>{//let OutValue;
document.getElementById('Form2').getElementsByTagName('label')[0].addEventListener('click',
    function OnClosing(e)
    {
        //base.OnClosing(e);
        if (fm2.gameEnd)
        {
            res(DialogResult.OK);
            fm2.OutValue = `点球大战结果\r\n${fm2.label1.Text}　${fm2.label13.Text}　－　${fm2.label14.Text}　${fm2.label2.Text}\r\n`
        }
    })}
</script>
