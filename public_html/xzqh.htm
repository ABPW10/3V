<meta charset=utf-8><title>行政区划</title><script src=src/networkRequest.js></script><div class=页面>
<div class=列表>
<a style=display:none href=javascript:void(0)></a>
<table style=border-spacing:0><tbody></tbody></table><script>
perform=(url,headers=undefined,body=undefined,method=undefined)=>new Promise(resolve => {
  var xhr = new XMLHttpRequest()

  xhr.open(method??'GET', 'http://ftphomeustc.web3v.work/asp/?url='+encodeURIComponent(url))

  xhr.send()

  xhr.onreadystatechange = function () {
    if (xhr.readyState === 4 && xhr.status === 200) {
      let result=xhr.responseText
      try {
        result=JSON.parse(result)
      } catch (error) {
        
      }
      resolve(result)
    }
  }
})

get=(url, options=undefined)=>perform(url,options?.headers,undefined,options?.method)
post=(url, options=undefined)=>perform(url,options?.headers,options?.body,'POST')
</script><script>
const 表格=document.getElementsByTagName('tbody')[0]
const 返回键=document.getElementsByTagName('a')[0]
let 上级=[]
显示()
function 显示(地区=''){
 表格.innerHTML=''
 表格.previousElementSibling?.remove()
 if(!(地区==''||/^\d+$/.test(地区))){return}
 if(地区.startsWith('71')){查询({code:'710000'});return}
 get('https://dmfw.mca.gov.cn/9095/xzqh/getList?maxLevel=2'+(地区?'&code='+地区:'')).then(信息=>{
  返回键.style.display=信息.data.name?'inline':'none'
  返回键.innerHTML='←'+(上级[上级.length-1]?.号码?`上一级（${上级[上级.length-1].名称}）`:'全国')
  document.title=(信息.data.name??'')+'行政区划'
  let 本级统计={}
  if(信息.data.name){表格.parentNode.insertAdjacentHTML('afterbegin',`<thead><th${信息.data.level==1?' class=省标题':''}>${信息.data.name}</th><th>${信息.data.code.endsWith('000000')?信息.data.code.replace('000000',''):信息.data.code.endsWith('000')?信息.data.code.substr(0,信息.data.code.lastIndexOf('000')):信息.data.code}</th></thead>`)}
  for(let 区划 of 信息.data.children){
    const 列表行=document.createElement('tr')
    if(区划.children?.length>0||区划.level<4){列表行.onclick=()=>{上级.push({号码:信息.data.name==null?'':信息.data.code,名称:信息.data.name});显示(区划.code)}}
    列表行.innerHTML=`<td${区划.level==1?' class=省标题':''}>${区划.children?.length>0||区划.level<4?`<a href=javascript:void(0)>${区划.name}</a>`:区划.name}</td><td>${区划.code.endsWith('000000')?区划.code.replace('000000',''):区划.code.endsWith('000')?区划.code.substr(0,区划.code.lastIndexOf('000')):区划.code}</td>`
    表格.appendChild(列表行)
    if(!本级统计[区划.type]){本级统计[区划.type]=0}
    ++本级统计[区划.type]
    let 统计={}
    for(let 下级区划 of 区划.children??[]){
      const 列表行=document.createElement('tr')
      列表行.innerHTML=`<td style=padding-left:1em>${下级区划.name}</td><td>${下级区划.code.endsWith('000000')?下级区划.code.replace('000000',''):下级区划.code.endsWith('000')?下级区划.code.substr(0,下级区划.code.lastIndexOf('000')):下级区划.code}</td>`
      表格.appendChild(列表行)
      if(!统计[下级区划.type]){统计[下级区划.type]=0}
      ++统计[下级区划.type]
    }
    if(Object.keys(统计).length>0){列表行.getElementsByTagName('td')[0].insertAdjacentHTML('beforeend',`（ ${Object.entries(统计).map(项=>项.reverse().join(' ')).join('、')} ）`)}
  }
  if(Object.keys(本级统计).length>0){
    const 主题信息=表格.previousElementSibling
    if(!主题信息){表格.parentNode.insertAdjacentHTML('afterbegin',`<thead><th colspan=2>${Object.entries(本级统计).map(项=>项.reverse().join(' ')).join('、')}</th></thead>`)}
    else{
      主题信息.getElementsByTagName('th')[0]?.insertAdjacentHTML('beforeend',`（ ${Object.entries(本级统计).map(项=>项.reverse().join(' ')).join('、')} ）`)
    }
  }
  if(信息.data.level<3){查询(信息.data.name?信息.data:undefined)}
 })
}
let 不更新图形=false
返回键.onclick=动作=>{
  动作.preventDefault();动作.stopPropagation();
  返回键.style.display='none'
  const 上一个内容=上级.pop()
  显示(上一个内容?.号码??'')
  if(上一个内容.号码===''&&当下图形.号码===''||上一个内容.号码&&当下图形.号码&&/^0*$/.test(上一个内容.号码.replace(当下图形.号码,''))
      ||上级.length>1&&上级[上级.length-1].号码&&当下图形.号码&&/^0*$/.test(上级[上级.length-1].号码.replace(当下图形.号码,''))){不更新图形=true;return}
  if(上一级页面暂存栈.length>0){
    const 上次显示的内容=上一级页面暂存栈.pop()
    if(上次显示的内容.号码.substr(0,6)===上一个内容.号码.substr(0,6)||上次显示的内容.名称=='中华人民共和国'&&上一个内容.名称==null){
    图纸.innerHTML=上次显示的内容.内容
    当下图形={名称:上次显示的内容.名称,号码:上一个内容.号码}
    不更新图形=true
    }
  }
}

<script src=https://www.webmap.cn/public/js/maps/map/adminDataStore.js></script>
<script>
const 上一级页面暂存栈=[]
const 行政区划查询地址=(查询条件='中华人民共和国',需要形状=false)=>`https://api.tianditu.gov.cn/v2/administrative?keyword=${查询条件}&childLevel=2${需要形状?'&extensions=true':''}&tk=bdbbba21b624d7f141c1f97c3d0fd7ef`
const 图形查询地址=(查询条件='china')=>`https://dmfw.mca.gov.cn/js/map/subject/${查询条件.length==4?`city/${查询条件}`:查询条件}.json`
let 当下图形
function 查询(目标=undefined){
  if(不更新图形){不更新图形=false;图纸.parentNode.scrollTo({top:(figureSize-图纸.parentNode.clientHeight)/2.0,left:(figureSize-图纸.parentNode.clientWidth)/2.0,behavior:'smooth'});return}
  const 查询名称=目标?'156'+目标.code.substr(0,6):undefined
  fetch(行政区划查询地址(查询名称)).then(取得数据=>取得数据.json()).then(数据集=>{
    const 数据=数据集.data.district[0]
    if(!数据||数据.children.length==0){return}
    if(查询名称){上一级页面暂存栈.push({名称:当下图形.名称,号码:当下图形.号码,内容:图纸.innerHTML})}
    图纸.innerHTML=''
    当下图形={名称:数据.name,号码:数据.name=='中华人民共和国'?'':数据.gb.substr(3)}
    projCtr=[数据.center.lng,数据.center.lat]
    const 最大经度差=Math.sin(Math.max(...数据.children.map(下级=>Math.PI*Math.abs(projCtr[0]-下级.center.lng)/180)))
    const 最大纬度差=Math.max(...数据.children.map(下级=>Math.PI*Math.abs(projCtr[1]-下级.center.lat)/180))
    if(Math.max(最大经度差,最大纬度差)>0){投影半径=2*Math.max(最大经度差,最大纬度差)}
    图纸.parentNode.scrollTo({top:(figureSize-图纸.parentNode.clientHeight)/2.0,left:(figureSize-图纸.parentNode.clientWidth)/2.0,behavior:'smooth'})
    for(const 区域 of 数据.children){
     if(目标&&+目标.code[0]>6){
     const 台湾省地级市={台北县:'新北市',桃园县:'桃园市',台南市:'台南县',台中市:'台中县',台北市:'7101',高雄市:['高雄县','7102']}
     let 自然资源部编码=区域.gb.startsWith('15671')?adminDataStore.find(省=>省.pac.substr(0,2)==='71')?.children[0]?.children.filter(市县=>市县.name===区域.name||台湾省地级市[市县.name]==区域.name||台湾省地级市[区域.name]==市县.name||市县.pac.startsWith(台湾省地级市[区域.name])||台湾省地级市[区域.name]instanceof Array&&(台湾省地级市[区域.name].includes(市县.name)||台湾省地级市[区域.name].some(项目=>市县.pac.startsWith(项目))))?.map(分区=>分区.pac):undefined
     if(区域.level===2&&自然资源部编码&&(!自然资源部编码 instanceof Array||自然资源部编码.length>0)){
      if(自然资源部编码 instanceof Array){
      for(const 分区编码 of 自然资源部编码){
      get(`https://www.webmap.cn/mapDataAction.do?method=mapAreaSearch&type=0&key=${分区编码}`).then(自然资源部精确形状=>{
        const 目标=自然资源部精确形状.itemList?自然资源部精确形状.itemList[0]:undefined
        if(!目标){return}
        if(当下图形.号码==数据.gb.substr(3)||当下图形.号码==''&&数据.name=='中华人民共和国'){显示区域(区域,目标.geom)}
      })
      }
      }
     }else{
      fetch(行政区划查询地址(区域.gb,true)).then(取得下级数据=>取得下级数据.json()).then(async 下级数据=>{
        const 形状原始数据=下级数据.data.district[0].boundary
        if(当下图形.号码==数据.gb.substr(3)||当下图形.号码==''&&数据.name=='中华人民共和国'){显示区域(区域,形状原始数据)}
      })
     }
     }else{if(当下图形.号码==数据.gb.substr(3)||当下图形.号码==''&&数据.name=='中华人民共和国'){显示区域(区域)}}
     function 显示区域(区域,形状原始数据){
        const 图形=document.createElement('g');
        if(区域.children.length>0){图形.setAttribute('onclick',`if(当下图形?.名称!='中华人民共和国'&&!当下图形?.号码.startsWith(document.getElementsByTagName('th')[1]?.textContent)||当下图形?.名称=='中华人民共和国'&&document.getElementsByTagName('th')[1]){return}上级.push({号码:'${当下图形.号码}',名称:'${当下图形.名称}'});显示('${区域.gb.substr(3)}')`)}
        const 使用颜色=选择颜色(区域.name)
        if(形状原始数据){
        const 专用格式数据=JSON.parse(形状原始数据.replace('MULTIPOLYGON','[').replaceAll('(','[').replaceAll(')',']').replaceAll(',','],[').replaceAll(' ',',')+']')
        drawShape(专用格式数据,使用颜色,图形)
        }
        const 标注文字颜色=相反颜色(使用颜色)
        const 是区域=区域.name.endsWith('省')||区域.name.endsWith('自治区')||区域.name.endsWith('自治州')||区域.name.endsWith('地区')||区域.name.endsWith('盟')||区域.name.endsWith('保护区')||区域.name.endsWith('马场')
        表示点(区域.center,区域.name,是区域?0:undefined,!是区域,标注文字颜色,图形)
        if(是区域&&!区域.name.endsWith('保护区')&&!区域.name.endsWith('马场')){
          表示点(区域.children[0].center,区域.children[0].name,1,true,标注文字颜色,图形)
        }
        图纸.insertAdjacentHTML('afterbegin',图形.outerHTML);
     }
    }
    if(数据.level<4){
        const 是区域=数据.name.endsWith('自治州')||数据.name.endsWith('地区')||数据.name.endsWith('盟')
    const 区域图形=document.createElement('g')
    表示点(数据.center,数据.name,是区域?0:undefined,!是区域,'black',区域图形)
    图纸.insertAdjacentHTML('afterbegin',区域图形.outerHTML)
    }
    if(!目标||+目标.code[0]<=6){
    get(图形查询地址(数据.name!=='中华人民共和国'?数据.gb.substr(3,数据.level==4?2:4)+(目标.type=='直辖市'?'01':''):undefined)).then(形状集合=>{
    const 形状数据=形状集合.features
    if(!形状数据||形状数据.length==0){return}
    for(let 区域 of 形状数据){
      if(当下图形.号码==数据.gb.substr(3)||当下图形.号码==''&&数据.name=='中华人民共和国'){显示区域(区域,数据.children.find(下级=>下级.gb.substr(3).startsWith(区域.properties.XZQH))?.children.length>0)}
      function 显示区域(区域,有下级){
        const 图形=document.createElement('g');
        if(有下级){图形.setAttribute('onclick',`if(当下图形?.名称!='中华人民共和国'&&!当下图形?.号码.startsWith(document.getElementsByTagName('th')[1]?.textContent)||当下图形?.名称=='中华人民共和国'&&document.getElementsByTagName('th')[1]){return}上级.push({号码:'${当下图形.号码}',名称:'${当下图形.名称}'});显示('${区域.properties.XZQH}')`)}
        const 使用颜色=选择颜色(区域.properties.TSMC)
        const 专用格式数据=区域.geometry.type==='MultiPolygon'?区域.geometry.coordinates:[区域.geometry.coordinates]
        drawShape(专用格式数据,使用颜色,图形)
        const 标注文字颜色=相反颜色(使用颜色)
        /*const 是区域=区域.properties.TSMC.endsWith('省')||区域.properties.TSMC.endsWith('自治区')||区域.properties.TSMC.endsWith('自治州')||区域.properties.TSMC.endsWith('地区')||区域.properties.TSMC.endsWith('盟')||区域.properties.TSMC.endsWith('保护区')||区域.properties.TSMC.endsWith('马场')
        表示点({lng:区域.properties.X,lat:区域.properties.Y},区域.properties.TSMC,0,!是区域,标注文字颜色,图形)*/
        图纸.insertAdjacentHTML('afterbegin',图形.outerHTML);
    }
    }
    })
    }
  })
}
function 选择颜色(文字){
        let 专用名字=文字
          if(专用名字!=='临夏县'&&专用名字!=='和田县'&&专用名字!=='伊宁县'&&专用名字!=='嘉义县'&&专用名字!=='新竹县'){
            if(专用名字.length<=3){专用名字=专用名字.substr(0,2)}
            else{
              if(专用名字==='东乡族自治县'){
                专用名字='东乡';
              }else if(专用名字==='内蒙古自治区'){
                专用名字='内蒙古';
              }else if(专用名字.startsWith('鄂温克')){
                专用名字='鄂温克旗';
              }else if(专用名字.startsWith('鄂伦春')){
                专用名字='鄂伦春旗';
              }else{
                专用名字=shortName(专用名字);
              }
              function shortName(longName){
                if(longName.includes('自治')||longName.startsWith('梅里斯')||longName.startsWith('管城')||longName.startsWith('顺河')||longName.startsWith('瀍河')){
                  longName=longName.replace('满族','').replace('蒙古','').replace('回族','')
                      .replace('达斡尔','').replace('鄂温克','').replace('鄂伦春','').replace('朝鲜','').replace('赫哲','')
                      .replace('畲族','').replace('土家','').replace('苗族','').replace('侗族','').replace('瑶族','')
                      .replace('壮族','').replace('仫佬','').replace('毛南','').replace('京族','').replace('黎族','')
                      .replace('羌族','').replace('藏族','').replace('彝族','').replace('布依','').replace('仡佬','').replace('水族','')
                      .replace('白族','').replace('纳西','').replace('傈僳','').replace('普米','').replace('独龙','').replace('怒族','')
                      .replace('阿昌','').replace('景颇','').replace('傣族','').replace('佤族','').replace('布朗','')
                      .replace('拉祜','').replace('德昂','').replace('基诺','').replace('哈尼','').replace('门巴','').replace('珞巴','')
                      .replace('保安','').replace('东乡族','').replace('撒拉','').replace('裕固','').replace('土族','')
                      .replace('维吾尔','').replace('哈萨克','').replace('柯尔克孜','').replace('锡伯','').replace('塔吉克','')
                      .replace('乌孜别克','').replace('俄罗斯','').replace('塔塔尔','').replace('高山族','').replaceAll('族','').replace('自治','')
                }
                if(longName.endsWith('旗')){
                  let 起始名字=longName.substr(0,3)
                  let 左=longName.indexOf('左'),右=longName.indexOf('右'),前=longName.indexOf('前'),中=longName.indexOf('中'),后=longName.indexOf('后')
                  let 旗方位名=''
                  if(左!==-1){旗方位名+='左'}
                  if(右!==-1){旗方位名+='右'}
                  if(前!==-1){旗方位名+='前'}
                  if(中!==-1){旗方位名+='中'}
                  if(后!==-1){旗方位名+='后'}
                  return 起始名字.substr(0,3-旗方位名.length)+旗方位名
                }else{
                  const EndNames=['特区','林区','特别行政区','地区','盟','州','县','区','市','镇','省','行政委员会']
                  for(let word of EndNames){
                    if(longName.endsWith(word)){
                      return longName.substr(0,longName.lastIndexOf(word))
                    }
                  }
                  return longName
                }
              }
            }
          }
        return 文字生成颜色(专用名字.substr(0,3))
}
function 相反颜色(颜色){
        颜色 = 颜色.slice(1);
    // invert color components
    var r = (255 - parseInt(颜色.slice(0, 2), 16)).toString(16),
        g = (255 - parseInt(颜色.slice(2, 4), 16)).toString(16),
        b = (255 - parseInt(颜色.slice(4, 6), 16)).toString(16);
    // pad each with zeros and return
    return '#' + String(r).padStart(2,'0') + String(g).padStart(2,'0') + String(b).padStart(2,'0');
}
function 颜色亮度(颜色){
        颜色 = 颜色.slice(1);
    return 1/3.0*parseInt(颜色.slice(0, 2), 16) + 0.5*parseInt(颜色.slice(2, 4), 16) + 1/6.0*parseInt(颜色.slice(4, 6), 16)
}
function 文字生成颜色(名字){
  第一个字符=名字.charCodeAt(0).toString(16)
  第二个字符=名字.charCodeAt(1).toString(16)
  if(名字.length>2){
    第三个字符=名字.charCodeAt(2).toString(16)
  }else{第三个字符=`${第一个字符.substr(1,1)}${第二个字符.substr(1,1)}`}
  return`#${第一个字符.substr(第一个字符.length-2,2)}${第二个字符.substr(第二个字符.length-2,2)}${第三个字符.substr(第三个字符.length-2,2)}`
}
function 表示点(坐标,标注,标注位置,显示点,颜色,图层,类名=undefined){
      let projPos=offset(坐标.lat,坐标.lng,projCtr[1],projCtr[0]);
      projPos[0]=Math.round((1+projPos[0]/投影半径)*figureSize/2)
      projPos[1]=Math.round((1-projPos[1]/投影半径)*figureSize/2)
      if(标注位置===undefined){标注位置=projPos[1]>figureSize/2}
        let 点表示=显示点?`<path class="${类名?类名:''}" stroke=${颜色} stroke-linecap=round d=M${projPos[0]},${projPos[1]}Z stroke-width=7></path>`:''
        点表示 += `<text paint-order="stroke fill" class="${显示点?'':类名?类名:''}" fill=${颜色} stroke=${颜色亮度(颜色)>=127.5?'black':'white'} stroke-width=2 x=${projPos[0]} y=${projPos[1]} text-anchor=middle dy=${标注位置==0?'-7':'19'}>${标注}</text>`
        图层.innerHTML+=点表示
}
</script>
