
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, user-scalable=no" />
<div id=cal style="height:100%;max-height:calc(2500px/4/4*3*3);display:grid;grid-template-columns:repeat(auto-fit,minmax(max(calc(100%/4),min(calc(100%/2),calc((100% + 500px)/6))),1fr))">
  <div style=display:grid;grid-template-columns:repeat(7,auto);height:100%;min-height:calc(1000px/6*3/4);background:#076></div>
  <div style=display:grid;grid-template-columns:repeat(7,auto);height:100%;min-height:calc(1000px/6*3/4);background:#185></div>
  <div style=display:grid;grid-template-columns:repeat(7,auto);height:100%;min-height:calc(1000px/6*3/4);background:#294></div>
  <div style=display:grid;grid-template-columns:repeat(7,auto);height:100%;min-height:calc(1000px/6*3/4);background:#3a3></div>
  <div style=display:grid;grid-template-columns:repeat(7,auto);height:100%;min-height:calc(1000px/6*3/4);background:#4b2></div>
  <div style=display:grid;grid-template-columns:repeat(7,auto);height:100%;min-height:calc(1000px/6*3/4);background:#5c1></div>
  <div style=display:grid;grid-template-columns:repeat(7,auto);height:100%;min-height:calc(1000px/6*3/4);background:#6d0></div>
  <div style=display:grid;grid-template-columns:repeat(7,auto);height:100%;min-height:calc(1000px/6*3/4);background:#7e1></div>
  <div style=display:grid;grid-template-columns:repeat(7,auto);height:100%;min-height:calc(1000px/6*3/4);background:#8f2></div>
  <div style=display:grid;grid-template-columns:repeat(7,auto);height:100%;min-height:calc(1000px/6*3/4);background:#9e3></div>
  <div style=display:grid;grid-template-columns:repeat(7,auto);height:100%;min-height:calc(1000px/6*3/4);background:#ad4></div>
  <div style=display:grid;grid-template-columns:repeat(7,auto);height:100%;min-height:calc(1000px/6*3/4);background:#bc5></div>
</div>
<script>
const cal=document.getElementById('cal');
const now=new Date;
document.title=now.toLocaleDateString(undefined,{year:'numeric'})
const firstDay=new Date(new Date(now).setMonth(0,1))
const firstDayWeek=firstDay.getDay()
let week=firstDayWeek;
const day=firstDay;
for(let month=0;month<12;month++){
  const mo=cal.children[month];
  for(let j=0;j<week;j++){
    const before=document.createElement('div')
    mo.appendChild(before)
  }
  for(;day.getMonth()===month;day.setDate(day.getDate()+1)){
    const date=document.createElement('div')
    date.setAttribute('style','position:relative')
    let cnCal
    if(parseInt(day.toLocaleDateString('zh-cn',{calendar:'chinese',day:'numeric'}).replace('日'))==1){
      cnCal=day.toLocaleDateString('zh-cn',{calendar:'chinese',month:'long'})
    }else{
      const browser=navigator.userAgent.toLowerCase();
      let dayText
      if(!browser.includes('chrome')&&!browser.includes('edg')&&(browser.includes('safari')||browser.includes('firefox'))){
        dayText=browser.includes('safari')?
                day.toLocaleDateString('zh-cn',{calendar:'chinese',dateStyle:'medium',numberingSystem:'hanidec'})
                :day.toLocaleDateString('zh-cn',{calendar:'chinese',numberingSystem:'hanidec'})
        cnCal=dayText.substr(dayText.indexOf('月')+1);
        if(cnCal.length===1){
          cnCal='初'+cnCal
        }else if(cnCal.endsWith('〇')){
          cnCal=cnCal.replace('〇','十')
          if(cnCal.startsWith('一')){
            cnCal=cnCal.replace('一','初')
          }
        }else if(cnCal.startsWith('一')){
          cnCal=cnCal.replace('一','十')
        }else if(cnCal.startsWith('二')){
          cnCal=cnCal.replace('二','廿')
        }
      }else{
        dayText=day.toLocaleDateString('zh-cn',{calendar:'chinese',dateStyle:'medium'})
        cnCal=dayText.substr(dayText.indexOf('月')+1);
      }
    }
    date.innerHTML=`<span style=position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;word-break:keep-all${day.getMonth()===now.getMonth()&&day.getDate()===now.getDate()?';background:cyan':''}${week===0||week===6?';color:red':''}>${day.getDate()}<br>${cnCal}</span>`
    mo.appendChild(date)
    week=(week+1)%7
  }
}
</script>
