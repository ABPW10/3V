function convert(a){
    k=0
    for(i=0;i<NTeams;i++){
        for(j=i+1;j<NTeams;j++){
            if(a==k)
                {return i,j}
            else

        }
    }
}
function inverse_convert(i1,j1){
    k=0
    for(i=0;i<NTeams;i++){
        for(j=i+1;j<NTeams;j++){
            if(i1==i && j1==j)
                {return k}
            else
                {k+=1}
        }
    }
}

function choice(choices) {
  var index = Math.floor(Math.random() * choices.length);
  return choices[index];
}
function pop1(tli){
    elem=choice(tli)
    tli.splice(tli.indexOf(elem),1)
    return elem
}

function add1(tli,elem){
    if(!tli.includes(elem)){tli.push(elem)}
    return tli.sort()//list(set(tli))
}

function del1(li,elem){
    if(li.includes(elem))
        {li.splice(li.indexOf(elem),1)}
}

        {ex_tab=tab}

        if (inverse_convert(i,j)>0){

            if (j<m && j>=n){

function* range(start, stop) {
    if (stop == null) {
        // one param defined
        stop = start;
        start = 0;
    }

    for (let i = start; i < stop; i++) {
        yield i;
    }
}
