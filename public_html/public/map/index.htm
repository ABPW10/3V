          短名=全名.replace('满族','').replace('蒙古族','').replace('回族','')
                      .replace('达斡尔族','').replace('鄂温克族','').replace('鄂伦春族','').replace('朝鲜族','').replace('赫哲族','')
                      .replace('畲族','').replace('土家族','').replace('苗族','').replace('侗族','').replace('瑶族','')
                      .replace('壮族','').replace('仫佬族','').replace('毛南族','').replace('京族','').replace('黎族','')
                      .replace('羌族','').replace('藏族','').replace('彝族','').replace('布依族','').replace('仡佬族','').replace('水族','')
                      .replace('白族','').replace('纳西族','').replace('傈僳族','').replace('普米族','').replace('独龙族','').replace('怒族','')
                      .replace('阿昌族','').replace('景颇','').replace('傣族','').replace('佤族','').replace('布朗族','')
                      .replace('拉祜族','').replace('德昂族','').replace('基诺族','').replace('哈尼族','').replace('门巴族','').replace('珞巴族','')
                      .replace('保安族','').replace('东乡族','').replace('撒拉族','').replace('裕固族','').replace('土族','')
                      .replace('维吾尔族','').replace('哈萨克族','').replace('柯尔克孜族','').replace('锡伯族','').replace('塔吉克族','')
                      .replace('乌孜别克族','').replace('俄罗斯族','').replace('塔塔尔族','').replace('高山族','').replace('各族','')
                      .replace('达斡尔','')
                      .replace('蒙古民族','').replace('达斡尔民族','').replace('鄂温克民族','').replace('鄂伦春民族','').replace('朝鲜民族','').replace('赫哲民族','')

                      .replace('乌孜别克民族','').replace('俄罗斯民族','').replace('塔塔尔民族','').replace('高山民族','')
          if(短名.lastIndexOf('民族')===短名.length-3||短名.lastIndexOf('族')===短名.length-2)
                      {短名=短名.replaceAll('民族','').replaceAll('族','')}
          if(短名.length<2){return 全名}
        }
        if(短名.length>2){
          if((所在地区==='台北市'||所在地区==='台中市'||所在地区==='高雄市'||所在地区==='台南市'||所在地区==='基隆市'||所在地区==='新竹市')&&短名.endsWith('区')){return 短名.substr(0,短名.lastIndexOf('区'))}

function 表示点(坐标,标注,标注位置,显示点,颜色='black',样式类名=undefined){
      let projPos=offset(坐标.lat,坐标.lng,projCtr[1],projCtr[0]);
      projPos[0]=Math.round((figureSizeX+projPos[0]/投影半径*figureSize)/2)
      projPos[1]=Math.round((figureSizeY-projPos[1]/投影半径*figureSize)/2)
      if(projPos[0]<0||projPos[0]>图形区域.clientWidth||projPos[1]<0||projPos[1]>图形区域.clientHeight){return}
        let 点表示=显示点?`<path class="${样式类名?样式类名:''}" stroke=${颜色} stroke-linecap=round d=M${projPos[0]},${projPos[1]}Z stroke-width=5></path>`:''

                    let 名字=地点数据[1]
                    名字=乡镇名简化方法(名字,地点数据[0])
    const [纬度,经度]=[地点数据[4],地点数据[3]]
    let 点的表示
    if(!(点的表示=表示点({lat:纬度,lng:经度},名字,0,1,'dimgrey'))){continue}
    const 点图层=document.createElement('g')
    点图层.innerHTML+=点的表示
    图形区域.insertAdjacentHTML('beforeend',点图层.outerHTML)
  }
  })()
    }else{
      alert(`未存储${市??省}的信息`)
    }
  })()
let 标注地点=()=>{}
let 拖动={状态:false}
const 每秒拖动次数=5
addEventListener("mousedown", (event) => {
  拖动={状态:true,起点:[event.clientX,event.clientY],开始:(new Date).getTime()}
  event.preventDefault();event.stopPropagation();
});
addEventListener("mousemove", (event) => {
  let 时间
  if(拖动.状态&&(时间=(new Date).getTime())-拖动.开始>1000/每秒拖动次数){event.preventDefault();event.stopPropagation();平移(event.clientX-拖动.起点[0],event.clientY-拖动.起点[1]);拖动.起点=[event.clientX,event.clientY];拖动.开始=时间}
});
addEventListener("mouseup", (event) => {
  拖动={状态:false}
});
addEventListener("wheel", event => {if(event.deltaY!=0){缩放(event.deltaY>0?'－':'＋')}});
function 平移(横向,竖向){
  const 系数={横向,竖向}
  const 原中心=[projCtr[0],projCtr[1]]
    projCtr[0]-=Math.min(投影半径*系数.横向/Math.cos(projCtr[1]/180*Math.PI),180)
    if(projCtr[0]<-180){projCtr[0]+=360}
    projCtr[1]+=投影半径*系数.竖向;if(projCtr[1]>90){projCtr[1]=90}
  if(projCtr[0]!=原中心[0]||projCtr[1]!=原中心[1]){图形区域.innerHTML='';画图();标注地点()}
}
function 缩放(增减){
  const 原半径=投影半径
  if(增减==='＋'){let 缩小半径=投影半径/Math.sqrt(2);if(figureSize/缩小半径<10000000){投影半径=缩小半径}}
  else if(增减==='－'){let 扩大半径=投影半径*Math.sqrt(2);if(figureSize/扩大半径>10000){投影半径=扩大半径}}
  if(投影半径!=原半径){图形区域.innerHTML='';画图();标注地点()}
}
}
