const 信息种类={
  na:{名称:'别名'},
  l:{
    名称:'坐标',
    检查手段:内容=>{
      let 分组=内容.replaceAll('，',',').split(',')
      return 分组.length==2&&分组.every(分组内容=>!isNaN(分组内容))
    },
    存储方式:文本=>文本.replaceAll('，',',').split(',').map(文本数字=>+文本数字)
  },
  c:{名称:'等级',含义:['建制','集镇','村镇','管区']},
  t:{名称:'性质',含义:['郊区','城区']}
}

function 创建新的地市(){
  let 名称=prompt('新的地市名称，要导入已复制到剪贴板的地市和县市区名称，请留空并按确定：')
  if(名称===undefined){return}
  if(名称.length>0){
    数据存储格式={}
    标题部分.textContent=名称
    显示内容()
  }else{
    (async()=>{
      const 粘贴的内容=(await navigator.clipboard.read())[0]
      const 粘贴内容是文字=粘贴的内容.types.includes('text/plain')
      if(!粘贴内容是文字){return}
      const 粘贴的文字=(await(await 粘贴的内容.getType('text/plain')).text()).split(/\s+/).filter(文字=>文字)
      数据存储格式={}
      标题部分.textContent=粘贴的文字.splice(0,1)[0]
      for(let 名字 of 粘贴的文字){
        数据存储格式[名字]={}
      }
      显示内容()
    })()
  }
}

function 打开省份(省名){
  if(!省名){return}
  if(省市列表[省名] instanceof Array){
    标题部分.textContent=省名
    回退指示.textContent=省名
    if(回退指示.nextElementSibling.nextElementSibling){回退指示.nextElementSibling.nextElementSibling.remove()}
    主要内容部分.innerHTML=''
    for(let 市 of 省市列表[省名]){
      主要内容部分.innerHTML+=`<li><a onclick=打开市('${省名}','${市}')>${市}</a>\n<a onclick="location.href='map?l=${市}'">[地图]</a></li>`
    }
  }else{
    打开市(省名)
  }
  所查看的省份=省名
}
var 数据存储格式,待执行的更改语句,地市分配
function 打开市(省,市=undefined){
  待执行的更改语句=undefined;
  (async()=>{
    let 查询结果
    数据存储格式={}
    待执行的更改语句=''
    地市分配={}
    if((await 查询(`SHOW TABLES LIKE '${市??省}'`)).length>0
        &&(查询结果=await 查询(`SELECT 地市区县,乡镇街道,别名,经度,纬度,等级,城郊性质 FROM ${市??省}`)).length>0){
      数据存储格式={}
      待执行的更改语句=''
      const 地区名=市??省
      for(let 乡镇街道 of 查询结果){
        let 县市区
        let 合并规则
        if(合并规则=所包含的地市[地区名]){
          合并的地市=合并规则.length>0?合并规则:地区名.split('、').map(初次拆分=>初次拆分.split('和')).flat()
          for(let 合并的地市名 of 合并的地市){
            if(乡镇街道[0].startsWith(合并的地市名)&&乡镇街道[0]!==合并的地市名){县市区=乡镇街道[0].replace(合并的地市名,'');break}
          }
          if(!县市区){县市区=乡镇街道[0]}
        }else{
          县市区=乡镇街道[0].replace(地区名,'')
        }
        const 地市名=乡镇街道[0].replace(县市区,'')
        if(地市分配[地市名+县市区]){县市区=地市名+县市区}
        else if(地市分配[县市区]&&地市分配[县市区]!=地市名){
          数据存储格式[地市分配[县市区]+县市区]=数据存储格式[县市区]
          delete 数据存储格式[县市区]
          地市分配[地市分配[县市区]+县市区]=地市分配[县市区]
          delete 地市分配[县市区]
          县市区=地市名+县市区
          数据存储格式[县市区]={}
          地市分配[县市区]=地市名
        }
        if(!地市分配[县市区]){地市分配[县市区]=地市名}
        if(!数据存储格式[县市区]){数据存储格式[县市区]={}}
        数据存储格式[县市区][乡镇街道[1]]={na:乡镇街道[2]??undefined,l:乡镇街道[3]&&乡镇街道[4]?[乡镇街道[3],乡镇街道[4]]:undefined,c:乡镇街道[5]??-1,t:乡镇街道[6]??-1}
      }
    }else{
      alert(`未存储${市??省}的信息`)
    }
    标题部分.textContent=市??省
    document.getElementsByClassName('navbar')[0].insertAdjacentHTML('beforeend',`<a target=_blank href=map?l=${市??省}>打开地图</a>`)
    显示内容()
  })()
}
function 显示内容(){

  const 导出数据格式=document.createElement('input')

  导出数据格式.value='查看导出数据'
  导出数据格式.onclick=()=>{
    const 弹出式对话框=document.createElement('div')

    const 文本显示区=document.createElement('textarea')
    文本显示区.readOnly=true
    文本显示区.style.resize='none'
    文本显示区.style.height='100%'
    文本显示区.style.width='100%'
    文本显示区.style.overflowY='auto'
    文本显示区.textContent=JSON.stringify(数据存储格式,null,2)
    弹出式对话框.appendChild(文本显示区)
    const 复制操作=document.createElement('input')
    复制操作.type='button'
    复制操作.value='复制'
    复制操作.onclick=()=>{
                let selStart=文本显示区.selectionStart;
                文本显示区.select();
                document.execCommand('copy')//richTextBox1.Copy();
                文本显示区.setSelectionRange(0,0)//DeselectAll();
                文本显示区.selectionStart = selStart;
    }
    弹出式对话框.appendChild(复制操作)
    const 下载操作=document.createElement('input')
    下载操作.type='button'
    下载操作.value='下载'
    下载操作.onclick=()=>{
            var aTag = document.createElement('a');
            var blob = new Blob([文本显示区.textContent]);
            aTag.download = `${标题部分.textContent}.json`;
            aTag.href = URL.createObjectURL(blob);
            aTag.click();
            URL.revokeObjectURL(blob);
    }
    弹出式对话框.appendChild(下载操作)
    const 自定义操作=document.createElement('input')
    自定义操作.type='button'
    自定义操作.value='自定义上传'
    自定义操作.onclick=()=>{
      const 分配地市对话框=document.createElement('div')
      分配地市对话框.style.position='fixed'
      分配地市对话框.style.left='20%'
      分配地市对话框.style.top='20%'
      分配地市对话框.style.height='60%'
      分配地市对话框.style.width='60%'
      分配地市对话框.style.border='solid 1px grey'
      分配地市对话框.style.borderRadius='1%'
      分配地市对话框.style.background='#fffb'
      分配地市对话框.style.overflow='auto'
      const 对话框标题=document.createElement('h3')
      对话框标题.innerHTML='编辑市县隶属关系'
      分配地市对话框.appendChild(对话框标题)
      const 原分配={}
      for(let 县 in 地市分配){
        原分配[县]=地市分配[县]
      }
      for(let 县 in 数据存储格式){
        const 县分段=document.createElement('p')
        const 县名称=document.createElement('label')
        县名称.innerHTML=县
        const 地市打字框=document.createElement('input')
        地市打字框.value=地市分配[县]
        地市打字框.onchange=()=>地市分配[县]=地市打字框.value
        const 一键填充=document.createElement('input')
        一键填充.type='button';一键填充.value='向下填充'
        一键填充.onclick=()=>{
          let 下一个县=县分段

  if(!j.pois){第一笔查询完成=true}else{
  if(j.pois.length==100){console.warn('还有未包含的数据。')}
  for(let 地点 of j.pois){
    if(!地点.name.endsWith('政府')){continue}

      地点.name.replace('人民政府','').replace('政府','')]={
